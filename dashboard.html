<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div><h2>لوحة التحكم</h2><p>ملخص مالي سريع</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="loadAll()">🔄 تحديث</button>
        <button class="btn btn-primary btn-sm" id="publish-all-btn"
                style="display:none;" onclick="publishAll()">
          📤 نشر كشوف الزبائن
        </button>
      </div>
    </div>

    <!-- بطاقات الإحصاء — 4 بطاقات -->
    <div class="grid-4" id="summary-cards" style="margin-bottom:20px;"></div>

    <!-- تنبيهات الديون -->
    <div id="debt-alerts" style="display:none; margin-bottom:16px;"></div>

    <!-- آخر العمليات -->
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin-bottom:0;">⚡ آخر العمليات</h3>
        <button class="btn btn-ghost btn-sm" onclick="navTo('ledger.html')">عرض الكل</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>الوقت</th><th>النوع</th><th>الحساب</th><th>المبلغ</th></tr></thead>
          <tbody id="recent-tbody"><tr><td colspan="4" class="empty-state">جاري التحميل…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- حسابات مدينة -->
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin-bottom:0;">⚠️ حسابات مدينة</h3>
        <span id="debtor-count" style="font-size:0.75rem;color:var(--red);"></span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>الكود</th><th>الاسم</th><th>رصيد $</th><th>رصيد €</th><th>كشف</th></tr></thead>
          <tbody id="debtor-tbody"><tr><td colspan="5" class="empty-state">جاري التحميل…</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" id="debtor-pages"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/app.js"></script>
<style>
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:900px){ .grid-4 { grid-template-columns:repeat(2,1fr); } }
@media(max-width:480px){ .grid-4 { grid-template-columns:repeat(2,1fr); gap:10px; } }
</style>
<script>
const PAGE_SIZE = 10;
let _debtors    = [];
let _debtorPage = 1;

(async () => {
  if (!await initApp('dashboard')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  // تحميل متوازٍ — كل شيء في نفس الوقت
  await Promise.all([
    UI.updateTreasury(),
    loadAll()
  ]);

  // حفظ السجل اليومي (مرة واحدة في اليوم)
  Storage.saveDailySnapshot().catch(e => console.log('snapshot:', e));

  // إظهار زر نشر الكل للأدمن
  if (Auth.isAdmin()) {
    const pb = document.getElementById('publish-all-btn');
    if (pb) pb.style.display = 'inline-flex';
  }

  // فحص تنبيهات الديون
  await checkDebtAlerts(accounts);

  // Real-time: تحديث تلقائي عند أي عملية
  Realtime.start(
    async (txn) => {
      // حدّث الخزينة والعمليات الأخيرة
      await UI.updateTreasury();
      const txns = await Transactions.getAll({ limit:50 });
      renderRecent(txns);
    },
    async () => {
      // حدّث إحصاءات الحسابات
      const accounts = await Accounts.getAll();
      renderSummaryShell(accounts);
    }
  );
})();

async function loadAll() {
  // نشغّل كل الطلبات بالتوازي بدل الترتيب
  const [accounts, txns] = await Promise.all([
    Accounts.getAll(),
    Transactions.getAll({ limit: 50 })
  ]);

  renderSummaryShell(accounts);
  renderRecent(txns);

  // الحسابات المدينة — نجلبها من الأعمدة المخزّنة (سريع)
  _debtors = accounts.filter(a =>
    parseFloat(a.bal_usd||0) < 0 || parseFloat(a.bal_eur||0) < 0
  );
  document.getElementById('debtor-count').textContent =
    _debtors.length ? _debtors.length + ' حساب مدين' : '';
  document.getElementById('summary-cards')
    .querySelector('#debtor-stat').textContent = _debtors.length;
  _debtorPage = 1;
  renderDebtorPage();
}

function renderSummaryShell(accounts) {
  const customers = accounts.filter(a=>a.type==='customer').length;
  const companies = accounts.filter(a=>a.type==='company').length;
  document.getElementById('summary-cards').innerHTML = `
    <div class="stat-card" style="border-right:3px solid var(--gold);">
      <div class="stat-label">حسابات الزبائن</div>
      <div class="stat-value" style="color:var(--gold);">${customers}</div>
    </div>
    <div class="stat-card" style="border-right:3px solid var(--euro);">
      <div class="stat-label">حسابات الشركات</div>
      <div class="stat-value" style="color:var(--euro);">${companies}</div>
    </div>
    <div class="stat-card" style="border-right:3px solid var(--blue);">
      <div class="stat-label">عمليات اليوم</div>
      <div class="stat-value" style="color:var(--blue);" id="today-stat">—</div>
    </div>
    <div class="stat-card" style="border-right:3px solid var(--red);">
      <div class="stat-label">حسابات مدينة</div>
      <div class="stat-value" style="color:var(--red);" id="debtor-stat">—</div>
    </div>`;
}

function renderRecent(txns) {
  // إخفاء عمليات حسابات الأرشيف (7xxx)
  txns = txns.filter(t =>
    !String(t.acc||'').startsWith('7') &&
    !String(t.from||'').startsWith('7') &&
    !String(t.to||'').startsWith('7')
  ).slice(0, 10);
  // حساب عمليات اليوم من البيانات المحمّلة
  const todayStr = new Date().toDateString();
  const todayCount = txns.filter(t=>new Date(t.date).toDateString()===todayStr).length;
  const el = document.getElementById('today-stat');
  if (el) el.textContent = todayCount;

  const labels = {dep:'إيداع',wit:'سحب',trf:'تحويل'};
  const colors  = {dep:'var(--green)',wit:'var(--red)',trf:'var(--blue)'};
  document.getElementById('recent-tbody').innerHTML = txns.length
    ? txns.map(t=>`<tr>
        <td style="font-size:0.71rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
        <td><span class="badge badge-${t.type}">${labels[t.type]||t.type}</span></td>
        <td style="font-size:0.78rem;">${UI.escapeHtml(t.acc||t.from||'—')}</td>
        <td style="font-weight:600;color:${colors[t.type]||'var(--text)'};">
          ${parseFloat(t.amt).toFixed(2)} ${t.cur.toUpperCase()}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" class="empty-state">لا توجد عمليات</td></tr>';
}

function renderDebtorPage() {
  const start = (_debtorPage-1)*PAGE_SIZE;
  const page  = _debtors.slice(start, start+PAGE_SIZE);
  const totalPages = Math.ceil(_debtors.length/PAGE_SIZE)||1;

  document.getElementById('debtor-tbody').innerHTML = page.length
    ? page.map(a=>{
        const usd = parseFloat(a.bal_usd||0);
        const eur = parseFloat(a.bal_eur||0);
        return `<tr class="row-debtor">
          <td style="font-weight:700;">${UI.escapeHtml(a.id)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:0.78rem;"
              onclick="navTo('statement.html?acc=${a.id}')">
              ${UI.escapeHtml(a.name)}
            </button>
          </td>
          <td style="color:${usd<0?'var(--red)':'var(--text)'};">${usd.toFixed(2)}</td>
          <td style="color:${eur<0?'var(--red)':'var(--text)'};">${eur.toFixed(2)}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="navTo('statement.html?acc=${a.id}')">📋</button></td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="5" class="empty-state">لا توجد حسابات مدينة ✅</td></tr>';

  const pg = document.getElementById('debtor-pages');
  if (totalPages<=1){pg.innerHTML='';return;}
  pg.innerHTML=`
    <button class="btn btn-ghost btn-sm" onclick="goDebtor(${_debtorPage-1})" ${_debtorPage===1?'disabled':''}>‹ السابق</button>
    <span>${_debtorPage} / ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" onclick="goDebtor(${_debtorPage+1})" ${_debtorPage===totalPages?'disabled':''}>التالي ›</button>`;
}

async function publishAll() {
  const btn = document.getElementById('publish-all-btn');
  if (btn) { btn.disabled=true; btn.textContent='⏳ جاري النشر…'; }
  try {
    // نشر مباشر لكل الزبائن
    const now = new Date().toISOString();
    const accounts = await Storage.getAccounts();
    const customers = accounts.filter(a => a.type === 'customer');
    if (!customers.length) {
      UI.toast('لا يوجد زبائن لنشر كشوفاتهم', 'error');
      return;
    }
    const ok = await Storage.publishAllClients(Auth.getUser().user);
    if (ok) {
      Storage.invalidate('accounts'); // إعادة تحميل الـ Cache
      UI.toast(`✅ تم نشر كشوف ${customers.length} زبون`);
    } else {
      UI.toast('خطأ في النشر — حاول مرة أخرى', 'error');
    }
  } finally {
    if (btn) { btn.disabled=false; btn.textContent='📤 نشر كشوف الزبائن'; }
  }
}

async function checkDebtAlerts(accounts) {
  const settings   = await Storage.getAlertSettings();
  const debtLimit  = parseFloat(settings.debt_limit || -500);
  const overLimit  = accounts.filter(a =>
    parseFloat(a.bal_usd||0) < debtLimit ||
    parseFloat(a.bal_eur||0) < debtLimit
  );
  const box = document.getElementById('debt-alerts');
  if (!overLimit.length) { box.style.display='none'; return; }
  box.style.display = 'block';
  box.innerHTML = `
    <div style="background:var(--red-dim);border:1px solid var(--red);
         border-radius:var(--radius);padding:14px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:700;color:var(--red);">
          🚨 ${overLimit.length} حساب تجاوز حد الدين (${debtLimit})
        </div>
        <button class="btn btn-ghost btn-sm" onclick="this.parentElement.parentElement.parentElement.style.display='none'">✕</button>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        ${overLimit.map(a => `
          <div style="display:flex;justify-content:space-between;align-items:center;
               background:rgba(0,0,0,0.2);border-radius:6px;padding:8px 12px;flex-wrap:wrap;gap:8px;">
            <span style="font-size:0.83rem;"><b>${UI.escapeHtml(a.id)}</b> — ${UI.escapeHtml(a.name)}</span>
            <span style="font-size:0.82rem;color:var(--red);">
              $${parseFloat(a.bal_usd||0).toFixed(2)} | €${parseFloat(a.bal_eur||0).toFixed(2)}
            </span>
            <button class="btn btn-ghost btn-sm"
              onclick="navTo('account-view.html?acc=${a.id}')">عرض الحساب</button>
          </div>`).join('')}
      </div>
    </div>`;
}

function goDebtor(p){
  const t=Math.ceil(_debtors.length/PAGE_SIZE)||1;
  if(p<1||p>t)return;
  _debtorPage=p; renderDebtorPage();
}
</script>
</body>
</html>
