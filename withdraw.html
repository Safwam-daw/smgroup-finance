<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — سحب نقدي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
<main id="main">
<div id="treasury-placeholder"></div>
<div class="page-header">
<div>
  <h2 data-i18n="withdraw_title">💸 سحب نقدي</h2>
  <p data-i18n="withdraw_subtitle">خصم رصيد من حساب</p>
</div>
</div>

<div class="card" style="margin-bottom:16px;">
<h3 data-i18n="withdraw_data">بيانات السحب</h3>
<div class="form-group">
<label>
  <span data-i18n="search_account">ابحث عن الحساب</span>
  <span style="color:var(--text3);font-size:0.7rem;" data-i18n="search_hint">(Enter لاختيار أول نتيجة)</span>
</label>
<div class="search-wrap">
<input type="text" id="wit-search" data-i18n-placeholder="search_placeholder" placeholder="ابحث بالاسم أو الكود…" autocomplete="off">
<div id="wit-res" class="search-dropdown"></div>
</div>
<input type="hidden" id="wit-id">
</div>
<div class="grid-2">
<div class="form-group">
<label data-i18n="currency">العملة</label>
<select id="wit-cur" class="currency-select" onchange="updatePreview()"></select>
</div>
<div class="form-group">
<label data-i18n="amount">المبلغ</label>
<input type="number" id="wit-amount" placeholder="0.00" min="0" step="0.01"
oninput="updatePreview()"
onkeydown="if(event.key==='Enter') doWithdraw(false)">
</div>
</div>
<div id="wit-preview" style="display:none; border-radius:8px; padding:14px;
margin-bottom:16px; font-size:0.84rem; line-height:1.8;"></div>
<button class="btn btn-danger btn-full" onclick="doWithdraw(false)" data-i18n="confirm_withdraw">⚠️ تأكيد السحب</button>
</div>

<div class="card">
<h3 data-i18n="recent_withdrawals">آخر السحوبات</h3>
<div class="tbl-wrap">
<table>
<thead><tr>
  <th data-i18n="col_time">الوقت</th>
  <th data-i18n="col_account">الحساب</th>
  <th data-i18n="col_amount">المبلغ</th>
  <th data-i18n="col_by">بواسطة</th>
</tr></thead>
<tbody id="recent-wit-tbody">
<tr><td colspan="4" class="empty-state" data-i18n="loading">جاري التحميل…</td></tr>
</tbody>
</table>
</div>
</div>
</main>
</div>

<!-- Overdraft Modal -->
<div id="overdraft-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
z-index:1000;align-items:center;justify-content:center;padding:16px;">
<div class="card" style="width:100%;max-width:420px;text-align:center;">
<div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
<h3 data-i18n="overdraft_title">رصيد غير كافٍ</h3>
<p id="overdraft-msg" style="color:var(--text2);margin:14px 0;font-size:0.87rem;line-height:1.7;"></p>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
<button class="btn btn-ghost" onclick="closeOverdraft()" data-i18n="cancel">إلغاء</button>
<button class="btn btn-danger" onclick="doWithdraw(true)" data-i18n="overdraft_proceed">السحب بالسالب</button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
(async () => {
if (!await initApp('withdraw')) return;
document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
await UI.updateTreasury();
await Currency.refreshSelects('USD');
UI.initSearch('wit', () => setTimeout(updatePreview, 80));
document.getElementById('wit-cur').addEventListener('change', updatePreview);
await renderRecent();
I18n.apply();
})();

async function updatePreview() {
const id  = document.getElementById('wit-id').value;
const cur = document.getElementById('wit-cur').value;
const amt = parseFloat(document.getElementById('wit-amount').value) || 0;
const box = document.getElementById('wit-preview');
if (!id) { box.style.display='none'; return; }
const sym    = await Currency.symbol(cur.toUpperCase());
const before = await Storage.getBalance(id, cur);
const after  = before - amt;
const over   = after < 0;
box.innerHTML = `
<div style="display:flex;gap:24px;flex-wrap:wrap;">
<div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">${I18n.t('current_balance')}</div>
<div style="font-weight:700;font-size:1rem;">${sym}${before.toFixed(2)}</div></div>
<div style="color:var(--text3);font-size:1.2rem;align-self:center;">→</div>
<div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">${I18n.t('balance_after')}</div>
<div style="font-weight:700;font-size:1rem;color:${over?'var(--red)':'var(--text)'};">
${sym}${after.toFixed(2)}${over?' ⚠️':''}</div></div>
${amt>0?`<div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">${I18n.t('amount')}</div>
<div style="font-weight:700;font-size:1rem;color:var(--red);">-${sym}${amt.toFixed(2)}</div></div>`:''}
</div>`;
box.style.background = over ? 'var(--red-dim)' : 'var(--surface2)';
box.style.border      = over ? '1px solid var(--red)' : '1px solid var(--border2)';
box.style.display     = 'block';
}

async function doWithdraw(force) {
const id  = document.getElementById('wit-id').value;
const cur = document.getElementById('wit-cur').value;
const amt = parseFloat(document.getElementById('wit-amount').value);
UI.showLoading(true);
const result = await Transactions.withdraw(id, cur, amt, force);
UI.showLoading(false);
if (result.ok) {
  UI.toast(I18n.t('withdraw_success'));
  closeOverdraft();
  UI.clearSearch('wit');
  document.getElementById('wit-amount').value='';
  document.getElementById('wit-preview').style.display='none';
  await UI.updateTreasury();
  await renderRecent();
} else if (result.needsConfirm) {
  const sym = await Currency.symbol(cur.toUpperCase());
  document.getElementById('overdraft-msg').innerHTML =
    `${I18n.t('current_balance')}: <b>${sym}${result.currentBal.toFixed(2)}</b><br>
     ${I18n.t('overdraft_amount')}: <b>${sym}${amt.toFixed(2)}</b><br>
     ${I18n.t('balance_will_be')}: <b style="color:var(--red);">${sym}${(result.currentBal-amt).toFixed(2)}</b>`;
  document.getElementById('overdraft-modal').style.display='flex';
} else { UI.toast(result.error,'error'); }
}

function closeOverdraft() { document.getElementById('overdraft-modal').style.display='none'; }

async function renderRecent() {
  const txns = (await Transactions.getAll({type:'wit'}))
    .filter(t => !String(t.acc||'').startsWith('7'))
    .slice(0,10);
  document.getElementById('recent-wit-tbody').innerHTML = txns.length
    ? (await Promise.all(txns.map(async t => {
        const acc = await Accounts.getById(t.acc);
        const sym = await Currency.symbol((t.cur||'USD').toUpperCase());
        return `<tr>
          <td style="font-size:0.72rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
          <td>${UI.escapeHtml(acc?acc.name:t.acc)}</td>
          <td style="color:var(--red);font-weight:600;">${sym}${parseFloat(t.amt).toFixed(2)}</td>
          <td style="font-size:0.75rem;color:var(--text2);">${UI.escapeHtml(t.by)}</td>
        </tr>`;
      }))).join('')
    : `<tr><td colspan="4" class="empty-state">${I18n.t('no_withdrawals')}</td></tr>`;
}
</script>
</body>
</html>
