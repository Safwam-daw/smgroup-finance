<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — إيداع نقدي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div><h2>💵 إيداع نقدي</h2><p>إضافة رصيد لحساب</p></div>
    </div>

    <!-- نموذج الإيداع -->
    <div class="card" style="margin-bottom:16px;">
      <h3>بيانات الإيداع</h3>
      <div class="form-group">
        <label>ابحث عن الحساب <span style="color:var(--text3);font-size:0.7rem;">(Enter لاختيار أول نتيجة)</span></label>
        <div class="search-wrap">
          <input type="text" id="dep-search" placeholder="ابحث بالاسم أو الكود…" autocomplete="off">
          <div id="dep-res" class="search-dropdown"></div>
        </div>
        <input type="hidden" id="dep-id">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>العملة</label>
          <select id="dep-cur" onchange="updatePreview()">
            <option value="usd">🇺🇸 دولار USD</option>
            <option value="eur">🇪🇺 يورو EUR</option>
          </select>
        </div>
        <div class="form-group">
          <label>المبلغ</label>
          <input type="number" id="dep-amount" placeholder="0.00" min="0" step="0.01"
                 oninput="updatePreview()"
                 onkeydown="if(event.key==='Enter') doDeposit()">
        </div>
      </div>

      <!-- معاينة -->
      <div id="dep-preview" style="display:none; border-radius:8px; padding:14px;
           margin-bottom:16px; font-size:0.84rem; line-height:1.8;
           background:var(--surface2); border:1px solid var(--border2);"></div>

      <button class="btn btn-primary btn-full" onclick="doDeposit()">✅ تأكيد الإيداع</button>
    </div>

    <!-- آخر الإيداعات -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin-bottom:0;">آخر الإيداعات</h3>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>الوقت</th><th>الحساب</th><th>المبلغ</th><th>بواسطة</th></tr></thead>
          <tbody id="recent-dep-tbody">
            <tr><td colspan="4" class="empty-state">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  if (!await initApp('deposit')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();

  // عند اختيار حساب → حدّث المعاينة تلقائياً
  UI.initSearch('dep', () => setTimeout(updatePreview, 80));
  document.getElementById('dep-cur').addEventListener('change', updatePreview);
  await renderRecent();
})();

async function updatePreview() {
  const id  = document.getElementById('dep-id').value;
  const cur = document.getElementById('dep-cur').value;
  const amt = parseFloat(document.getElementById('dep-amount').value) || 0;
  const box = document.getElementById('dep-preview');
  if (!id) { box.style.display='none'; return; }
  const sym    = cur==='usd' ? '$' : '€';
  const before = await Storage.getBalance(id, cur);
  const after  = before + amt;
  box.innerHTML = `
    <div style="display:flex;gap:24px;flex-wrap:wrap;">
      <div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">الرصيد الحالي</div>
           <div style="font-weight:700;font-size:1rem;">${sym}${before.toFixed(2)}</div></div>
      <div style="color:var(--text3);font-size:1.2rem;align-self:center;">→</div>
      <div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">بعد الإيداع</div>
           <div style="font-weight:700;font-size:1rem;color:var(--green);">${sym}${after.toFixed(2)}</div></div>
      ${amt>0?`<div><div style="font-size:0.7rem;color:var(--text3);margin-bottom:2px;">المبلغ</div>
           <div style="font-weight:700;font-size:1rem;color:var(--gold);">+${sym}${amt.toFixed(2)}</div></div>`:''}
    </div>`;
  box.style.display = 'block';
}

async function doDeposit() {
  const id  = document.getElementById('dep-id').value;
  const cur = document.getElementById('dep-cur').value;
  const amt = parseFloat(document.getElementById('dep-amount').value);
  UI.showLoading(true);
  const result = await Transactions.deposit(id, cur, amt);
  UI.showLoading(false);
  if (result.ok) {
    UI.toast('تم الإيداع بنجاح ✅');
    document.getElementById('dep-search').value = '';
    document.getElementById('dep-id').value = '';
    document.getElementById('dep-amount').value = '';
    document.getElementById('dep-preview').style.display = 'none';
    await UI.updateTreasury();
    await renderRecent();
  } else { UI.toast(result.error, 'error'); }
}

async function renderRecent() {
  const txns = (await Transactions.getAll({type:'dep'})).slice(0,10);
  document.getElementById('recent-dep-tbody').innerHTML = txns.length
    ? (await Promise.all(txns.map(async t => {
        const acc = await Accounts.getById(t.acc);
        const sym = t.cur==='usd'?'$':'€';
        return `<tr>
          <td style="font-size:0.72rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
          <td>${UI.escapeHtml(acc?acc.name:t.acc)}</td>
          <td style="color:var(--green);font-weight:600;">${sym}${parseFloat(t.amt).toFixed(2)}</td>
          <td style="font-size:0.75rem;color:var(--text2);">${UI.escapeHtml(t.by)}</td>
        </tr>`;
      }))).join('')
    : '<tr><td colspan="4" class="empty-state">لا توجد إيداعات</td></tr>';
}
</script>
</body>
</html>
