<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — إيداع نقدي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div>
        <h2 data-i18n="deposit_title">💵 إيداع نقدي</h2>
        <p data-i18n="deposit_subtitle">إضافة رصيد لحساب</p>
      </div>
    </div>

    <!-- نموذج الإيداع -->
    <div class="card" style="margin-bottom:16px;">
      <h3 data-i18n="deposit_data">بيانات الإيداع</h3>
      <div class="form-group">
        <label>
          <span data-i18n="search_account">ابحث عن الحساب</span>
          <span style="color:var(--text3);font-size:0.7rem;" data-i18n="search_hint">(Enter لاختيار أول نتيجة)</span>
        </label>
        <div class="search-wrap">
          <input type="text" id="dep-search" data-i18n-placeholder="search_placeholder" placeholder="ابحث بالاسم أو الكود…" autocomplete="off">
          <div id="dep-res" class="search-dropdown"></div>
        </div>
        <input type="hidden" id="dep-id">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label data-i18n="currency">العملة</label>
          <select id="dep-cur" class="currency-select" onchange="updatePreview()"></select>
        </div>
        <div class="form-group">
          <label data-i18n="amount">المبلغ</label>
          <input type="number" id="dep-amount" placeholder="0.00" min="0" step="0.01"
                 oninput="updatePreview()"
                 onkeydown="if(event.key==='Enter') doDeposit()">
        </div>
      </div>

      <!-- معاينة -->
      <div id="dep-preview" style="display:none; border-radius:8px; padding:14px;
           margin-bottom:16px; font-size:0.84rem; line-height:1.8;
           background:var(--surface2); border:1px solid var(--border2);"></div>

      <button class="btn btn-primary btn-full" onclick="doDeposit()" data-i18n="confirm_deposit">✅ تأكيد الإيداع</button>
    </div>

    <!-- آخر الإيداعات -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin-bottom:0;" data-i18n="recent_deposits">آخر الإيداعات</h3>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th data-i18n="col_time">الوقت</th>
            <th data-i18n="col_account">الحساب</th>
            <th data-i18n="col_amount">المبلغ</th>
            <th data-i18n="col_by">بواسطة</th>
          </tr></thead>
          <tbody id="recent-dep-tbody">
            <tr><td colspan="4" class="empty-state" data-i18n="loading">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
(async () => {
  if (!await initApp('deposit')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  await Currency.refreshSelects('USD');
  UI.initSearch('dep', () => setTimeout(updatePreview, 80));
  document.getElementById('dep-cur').addEventListener('change', updatePreview);
  await renderRecent();
  I18n.apply();
})();

async function updatePreview() {
  const id  = document.getElementById('dep-id').value;
  const cur = document.getElementById('dep-cur').value;
  const amt = parseFloat(document.getElementById('dep-amount').value) || 0;
  const box = document.getElementById('dep-preview');
  if (!id || amt <= 0) { box.style.display='none'; return; }
  const sym    = await Currency.symbol(cur.toUpperCase());
  const before = await Storage.getBalance(id, cur);
  const accounts  = await Storage.getAccounts();
  const acc       = accounts.find(a => a.id === id);
  const ratePct   = (acc && acc.type==='customer') ? parseFloat(acc.commission_rate??0.025) : 0;
  const commission= ratePct > 0 ? Math.max(0, parseFloat((amt * ratePct / 100).toFixed(2))) : 0;
  const minComm   = commission >= 0.01 ? commission : 0;
  const net       = parseFloat((amt - minComm).toFixed(2));
  const after     = parseFloat((before + net).toFixed(2));

  box.innerHTML = `
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">
      <div>
        <div style="font-size:0.68rem;color:var(--text3);margin-bottom:2px;">${I18n.t('deposited_amount')}</div>
        <div style="font-weight:700;font-size:1rem;color:var(--gold);">${sym}${amt.toFixed(2)}</div>
      </div>
      ${minComm > 0 ? `
      <div>
        <div style="font-size:0.68rem;color:var(--text3);margin-bottom:2px;">${I18n.t('commission_pct')} (${ratePct}%)</div>
        <div style="font-weight:700;font-size:1rem;color:var(--red);">-${sym}${minComm.toFixed(2)}</div>
      </div>` : ''}
      <div>
        <div style="font-size:0.68rem;color:var(--text3);margin-bottom:2px;">${I18n.t('net_to_account')}</div>
        <div style="font-weight:700;font-size:1rem;color:var(--green);">${sym}${net.toFixed(2)}</div>
      </div>
      <div style="color:var(--text3);font-size:1.1rem;align-self:center;">→</div>
      <div>
        <div style="font-size:0.68rem;color:var(--text3);margin-bottom:2px;">${I18n.t('new_balance')}</div>
        <div style="font-weight:700;font-size:1rem;">${sym}${after.toFixed(2)}</div>
      </div>
    </div>`;
  box.style.display = 'block';
}

async function doDeposit() {
  const id  = document.getElementById('dep-id').value;
  const cur = document.getElementById('dep-cur').value;
  const amt = parseFloat(document.getElementById('dep-amount').value);
  UI.showLoading(true);
  const result = await Transactions.deposit(id, cur, amt);
  UI.showLoading(false);
  if (result.ok) {
    const commMsg = result.commission > 0
      ? ` · ${I18n.t('commission')}: ${result.commission.toFixed(4)}`
      : '';
    UI.toast(I18n.t('deposit_success') + commMsg);
    document.getElementById('dep-search').value = '';
    document.getElementById('dep-id').value = '';
    document.getElementById('dep-amount').value = '';
    document.getElementById('dep-preview').style.display = 'none';
    await UI.updateTreasury();
    await renderRecent();
  } else { UI.toast(result.error, 'error'); }
}

async function renderRecent() {
  const txns = (await Transactions.getAll({type:'dep'}))
    .filter(t => !String(t.acc||'').startsWith('7'))
    .slice(0,10);
  document.getElementById('recent-dep-tbody').innerHTML = txns.length
    ? (await Promise.all(txns.map(async t => {
        const acc = await Accounts.getById(t.acc);
        const sym = await Currency.symbol((t.cur||'USD').toUpperCase());
        return `<tr>
          <td style="font-size:0.72rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
          <td>${UI.escapeHtml(acc?acc.name:t.acc)}</td>
          <td style="color:var(--green);font-weight:600;">${sym}${parseFloat(t.amt).toFixed(2)}</td>
          <td style="font-size:0.75rem;color:var(--text2);">${UI.escapeHtml(t.by)}</td>
        </tr>`;
      }))).join('')
    : `<tr><td colspan="4" class="empty-state">${I18n.t('no_deposits')}</td></tr>`;
}
</script>
</body>
</html>
