<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="analytics_title">📈 الإحصائيات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.analytics-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:14px; margin-bottom:14px;
}
.chart-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px;
}
.chart-card h3 {
  font-size:0.88rem; color:var(--text2);
  margin-bottom:14px; font-weight:600;
}
.chart-wrap { position:relative; height:200px; }
.kpi-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
  gap:12px; margin-bottom:14px;
}
.kpi-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
  text-align:center;
}
.kpi-label { font-size:0.7rem; color:var(--text3); margin-bottom:6px; }
.kpi-value { font-size:1.3rem; font-weight:700; }
.kpi-sub   { font-size:0.72rem; color:var(--text3); margin-top:4px; }
.top-list { display:flex; flex-direction:column; gap:8px; }
.top-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; background:var(--surface2);
  border:1px solid var(--border2); border-radius:var(--radius-sm);
}
.top-rank {
  width:24px; height:24px; border-radius:50%;
  background:var(--gold-dim); color:var(--gold);
  font-size:0.72rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.top-name { flex:1; font-size:0.82rem; font-weight:600; }
.top-val  { font-size:0.82rem; font-weight:700; }
.period-btns { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.period-btn {
  padding:6px 16px; border-radius:20px; border:1px solid var(--border2);
  background:transparent; color:var(--text2); font-size:0.76rem;
  font-family:inherit; cursor:pointer; transition:all .15s;
}
.period-btn.active { background:var(--gold); color:#000; border-color:var(--gold); font-weight:700; }
.no-data {
  text-align:center; padding:40px; color:var(--text3); font-size:0.82rem;
}
.print-header { display:none; }
@media(max-width:640px) {
  .analytics-grid { grid-template-columns:1fr; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .chart-wrap { height:160px; }
}
@media print {
  #sidebar,#topbar,#sidebar-overlay,#toast,
  #treasury-bar,#treasury-placeholder,
  .no-print,.period-btns { display:none !important; }
  .print-header { display:block !important; border-bottom:3px solid #c9a84c; padding-bottom:12px; margin-bottom:16px; }
  body { background:#fff !important; color:#111 !important; }
  #main { margin:0 !important; padding:16px !important; }
  .analytics-grid { grid-template-columns:1fr 1fr !important; gap:10px !important; }
  .kpi-grid { grid-template-columns:repeat(4,1fr) !important; gap:8px !important; }
  .chart-card { background:#fff !important; border:1px solid #ccc !important; break-inside:avoid; padding:12px !important; }
  .chart-wrap { height:150px !important; }
  .kpi-card { background:#fffbef !important; border:1px solid #c9a84c !important; break-inside:avoid; padding:10px !important; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
}
</style>
</head>
<body>
<div id="app">
<main id="main">
<div id="treasury-placeholder"></div>

<div class="print-header">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1 id="print-report-brand" style="font-size:1.3rem;color:#111;font-weight:700;"></h1>
      <p id="print-period-label" style="font-size:0.75rem;color:#555;margin-top:3px;"></p>
    </div>
    <div style="font-size:0.75rem;color:#555;text-align:left;">
      <span data-i18n="print_date_an">طُبع بتاريخ:</span> <b id="print-date-analytics"></b>
    </div>
  </div>
  <div style="margin-top:6px;font-size:0.65rem;color:#aaa;text-align:center;" id="print-dawtech-analytics"></div>
</div>

<div class="page-header">
  <div><h2 data-i18n="analytics_title">📈 الإحصائيات</h2><p data-i18n="analytics_subtitle">تحليل أداء المنظومة المالية</p></div>
  <button class="btn btn-ghost btn-sm no-print" onclick="window.print()" data-i18n="print_btn2">🖨️ طباعة</button>
</div>

<div class="period-btns">
  <button class="period-btn active" onclick="setPeriod(7,this)"   data-i18n="period_7">آخر 7 أيام</button>
  <button class="period-btn"        onclick="setPeriod(30,this)"  data-i18n="period_30">آخر 30 يوم</button>
  <button class="period-btn"        onclick="setPeriod(90,this)"  data-i18n="period_90">آخر 3 أشهر</button>
  <button class="period-btn"        onclick="setPeriod(365,this)" data-i18n="period_365">السنة كاملة</button>
</div>

<!-- KPI Cards — تُبنى ديناميكياً -->
<div class="kpi-grid" id="kpi-grid"></div>

<!-- الرسوم البيانية -->
<div class="analytics-grid">
  <div class="chart-card">
    <h3 data-i18n="chart_treasury_growth">💰 نمو الخزينة</h3>
    <div class="chart-wrap"><canvas id="chart-treasury"></canvas></div>
  </div>
  <div class="chart-card">
    <h3 data-i18n="chart_profit_cumul">📈 الأرباح التراكمية</h3>
    <div class="chart-wrap"><canvas id="chart-profit"></canvas></div>
  </div>
  <div class="chart-card">
    <h3 data-i18n="chart_accounts_growth">👥 نمو الحسابات</h3>
    <div class="chart-wrap"><canvas id="chart-accounts"></canvas></div>
  </div>
  <div class="chart-card">
    <h3 data-i18n="chart_debtors">⚠️ الحسابات المدينة</h3>
    <div class="chart-wrap"><canvas id="chart-debtors"></canvas></div>
  </div>
</div>

<!-- أكبر العملاء لكل عملة — يُبنى ديناميكياً -->
<div class="analytics-grid" id="top-customers-grid"></div>

<!-- أنشط الموظفين -->
<div class="analytics-grid">
  <div class="chart-card">
    <h3 data-i18n="top_employees">👤 أنشط الموظفين</h3>
    <div class="top-list" id="top-employees"></div>
  </div>
</div>

</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/db-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/accounts.js"></script>
<script src="js/transactions.js"></script>
<script src="js/ui.js"></script>
<script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
let _snapshots  = [];
let _accounts   = [];
let _txns       = [];
let _currencies = [];
let _days       = 7;
let _charts     = {};

// ألوان ثابتة لكل عملة
const CUR_COLORS = {
  usd: { line:'#c9a84c', bg:'rgba(201,168,76,0.08)',  sym:'$' },
  eur: { line:'#a78bfa', bg:'rgba(167,139,250,0.08)', sym:'€' },
  gbp: { line:'#34d399', bg:'rgba(52,211,153,0.08)',  sym:'£' },
  try: { line:'#f87171', bg:'rgba(248,113,113,0.08)', sym:'₺' },
  iqd: { line:'#60a5fa', bg:'rgba(96,165,250,0.08)',  sym:'د.ع' },
  sar: { line:'#fbbf24', bg:'rgba(251,191,36,0.08)',  sym:'ر.س' },
};
function _curColor(code) {
  return CUR_COLORS[code.toLowerCase()] || { line:'#94a3b8', bg:'rgba(148,163,184,0.08)', sym: code };
}

(async () => {
  if (!await initApp('analytics')) return;
  if (!Auth.isAdmin()) { navTo('dashboard.html'); return; }
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();

  UI.showLoading(true);
  [_snapshots, _accounts, _txns, _currencies] = await Promise.all([
    Storage.getSnapshots(365),
    Storage.getAccounts(),
    Storage.getTxns(),
    Currency.getActive()
  ]);
  UI.showLoading(false);

  render();

  document.getElementById('print-date-analytics').textContent = new Date().toLocaleDateString();
  document.getElementById('print-report-brand').textContent   = brandName() + ' — ' + t('report_title');
  document.getElementById('print-dawtech-analytics').textContent = brandPrintCopyright();

  window.addEventListener('beforeprint', () => {
    const periodMap = { 7:t('period_7'), 30:t('period_30'), 90:t('period_90'), 365:t('period_365') };
    document.getElementById('print-period-label').textContent =
      t('period_lbl') + ' ' + (periodMap[_days] || _days + ' ' + t('day_unit'));
  });
})();

function setPeriod(days, btn) {
  _days = days;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const cutoff   = new Date();
  cutoff.setDate(cutoff.getDate() - _days);
  const filtered = _snapshots
    .filter(s => new Date(s.snapshot_date) >= cutoff)
    .sort((a,b) => a.snapshot_date.localeCompare(b.snapshot_date));

  renderKPIs(filtered);
  renderCharts(filtered);
  renderTopCustomers();
  renderTopEmployees();
}

// ══ KPI ═══════════════════════════════════════════════════
function renderKPIs(data) {
  const grid = document.getElementById('kpi-grid');

  // بطاقة إجمالي الحسابات (عملاء + شركات)
  const latest = data.length ? data[data.length - 1] : null;
  const oldest = data.length ? data[0] : null;

  const totalAccounts  = latest ? latest.total_accounts  : _accounts.filter(a=>a.id!=='9999').length;
  const totalCustomers = latest ? latest.total_customers : _accounts.filter(a=>a.type==='customer').length;
  const totalCompanies = latest ? latest.total_companies : _accounts.filter(a=>a.type==='company').length;
  const totalDebtors   = latest ? latest.total_debtors  : 0;
  const accDiff        = latest && oldest ? latest.total_accounts - oldest.total_accounts : 0;

  let html = `
    <div class="kpi-card">
      <div class="kpi-label">👥 ${t('kpi_total_accounts_lbl')}</div>
      <div class="kpi-value" style="color:var(--gold);">${totalAccounts}</div>
      <div class="kpi-sub">${t("kpi_total_accounts_sub", {c: totalCustomers, co: totalCompanies})}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">⚠️ ${t('kpi_total_debtors_lbl')}</div>
      <div class="kpi-value" style="color:var(--red);">${totalDebtors}</div>
      <div class="kpi-sub">${t('of_total_accounts', { n: totalAccounts })}</div>
    </div>`;

  // بطاقة خزينة لكل عملة مفعّلة
  _currencies.forEach(cur => {
    const code    = cur.code.toLowerCase();
    const sym     = cur.symbol || cur.code;
    const col     = 'treasury_' + code;
    const clr     = _curColor(code);
    const val     = latest ? (latest[col] || 0) : _calcLiveTreasury(cur.code);
    const oldVal  = oldest ? (oldest[col] || 0) : 0;
    const diff    = parseFloat((val - oldVal).toFixed(2));
    const diffTxt = (diff >= 0 ? '▲ +' : '▼ ') + sym + Math.abs(diff).toFixed(0);
    const diffClr = diff >= 0 ? 'var(--green)' : 'var(--red)';
    const lbl     = t('kpi_treasury_cur', { name: cur.name, code: cur.code });

    html += '<div class="kpi-card">'
      + '<div class="kpi-label">💰 ' + lbl + '</div>'
      + '<div class="kpi-value" style="color:' + clr.line + ';">' + sym + parseFloat(val).toLocaleString('en', {minimumFractionDigits:0, maximumFractionDigits:0}) + '</div>'
      + '<div class="kpi-sub" style="color:' + diffClr + ';">' + diffTxt + '</div>'
      + '</div>';
  });

  // بطاقة أرباح — تقرأ مباشرة من رصيد حساب الأرباح (9999) دائماً
  const profAcc = _accounts.find(a => a.id === '9999');
  _currencies.forEach(cur => {
    const code    = cur.code.toLowerCase();
    const sym     = cur.symbol || cur.code;
    const clr     = _curColor(code);
    // الأرباح الحقيقية = رصيد حساب 9999 الحالي (يتغير عند صرف الرواتب والمصاريف)
    const val     = parseFloat(profAcc?.['bal_' + code] || 0);
    const colSnap = 'profit_' + code;
    const oldVal  = oldest ? (oldest[colSnap] || 0) : 0;
    const diff    = parseFloat((val - oldVal).toFixed(2));
    const diffTxt = (diff >= 0 ? '▲ +' : '▼ ') + sym + Math.abs(diff).toFixed(0);
    const diffClr = diff >= 0 ? 'var(--green)' : 'var(--red)';
    const lbl     = t('kpi_profit_cur', { name: cur.name, code: cur.code });

    html += '<div class="kpi-card">'
      + '<div class="kpi-label">📈 ' + lbl + '</div>'
      + '<div class="kpi-value" style="color:' + clr.line + ';">' + sym + val.toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</div>'
      + '<div class="kpi-sub" style="color:' + diffClr + ';">' + diffTxt + ' ' + t('since_period') + '</div>'
      + '</div>';
  });

  grid.innerHTML = html;
}

// حساب مباشر من الحسابات إذا لم توجد snapshots
function _calcLiveTreasury(curCode) {
  const col = `bal_${curCode.toLowerCase()}`;
  return _accounts
    .filter(a => a.id !== '9999')
    .reduce((s, a) => s + parseFloat(a[col] || 0), 0);
}

// ══ الرسوم البيانية ════════════════════════════════════════
function makeChart(id, labels, datasets, type='line') {
  if (_charts[id]) _charts[id].destroy();
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  _charts[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { color:'#8a9bb5', font:{ size:11 } } } },
      scales: {
        x: { ticks:{ color:'#4a5a72', font:{size:10}, maxTicksLimit:6 }, grid:{ color:'#1e2d42' } },
        y: { ticks:{ color:'#4a5a72', font:{size:10} }, grid:{ color:'#1e2d42' } }
      }
    }
  });
}

function renderCharts(data) {
  const noDataMsg = `<div class="no-data">${t('no_data_general')}</div>`;
  if (!data.length) {
    ['chart-treasury','chart-profit','chart-accounts','chart-debtors'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.parentElement.innerHTML = noDataMsg;
    });
    return;
  }

  const labels = data.map(s => s.snapshot_date.slice(5));

  // خزينة — سطر لكل عملة مفعّلة
  const treasuryDatasets = _currencies.map(cur => {
    const code = cur.code.toLowerCase();
    const clr  = _curColor(code);
    return {
      label: cur.symbol + ' ' + cur.code,
      data: data.map(s => s[`treasury_${code}`] || 0),
      borderColor: clr.line, backgroundColor: clr.bg,
      fill: true, tension: 0.4, pointRadius: 2
    };
  });
  makeChart('chart-treasury', labels, treasuryDatasets);

  // أرباح — سطر لكل عملة مفعّلة
  const profitDatasets = _currencies.map(cur => {
    const code = cur.code.toLowerCase();
    const clr  = _curColor(code);
    return {
      label: cur.symbol + ' ' + cur.code,
      data: data.map(s => s[`profit_${code}`] || 0),
      borderColor: clr.line, backgroundColor: clr.bg,
      fill: true, tension: 0.4, pointRadius: 2
    };
  });
  makeChart('chart-profit', labels, profitDatasets);

  // حسابات
  makeChart('chart-accounts', labels, [
    {
      label: t('chart_clients'),
      data: data.map(s => s.total_customers || 0),
      borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.08)',
      fill:true, tension:0.3, pointRadius:2
    },
    {
      label: t('chart_companies'),
      data: data.map(s => s.total_companies || 0),
      borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,0.08)',
      fill:true, tension:0.3, pointRadius:2
    }
  ]);

  // مدينون
  makeChart('chart-debtors', labels, [{
    label: t('chart_debtors_lbl'),
    data: data.map(s => s.total_debtors || 0),
    borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,0.08)',
    fill:true, tension:0.3, pointRadius:2
  }]);
}

// ══ أكبر العملاء — ديناميكي ════════════════════════════════
function renderTopCustomers() {
  const grid = document.getElementById('top-customers-grid');
  let html = '';

  _currencies.forEach(cur => {
    const code = cur.code.toLowerCase();
    const col  = `bal_${code}`;
    const sym  = cur.symbol || cur.code;
    const clr  = _curColor(code);

    const top = _accounts
      .filter(a => a.type === 'customer' && parseFloat(a[col] || 0) > 0)
      .sort((a,b) => parseFloat(b[col]||0) - parseFloat(a[col]||0))
      .slice(0, 3);

    const rows = top.length
      ? top.map((a,i) => `
          <div class="top-item">
            <div class="top-rank">${i+1}</div>
            <div class="top-name">${UI.escapeHtml(a.name)} <span style="color:var(--text3);font-size:0.7rem;">#${a.id}</span></div>
            <div class="top-val" style="color:${clr.line};">${sym}${parseFloat(a[col]).toFixed(2)}</div>
          </div>`).join('')
      : '<div class="no-data">' + t('no_creditors_cur') + '</div>';

    html += '<div class="chart-card">'
      + '<h3>' + t('top_clients_cur', { sym: sym, code: cur.code }) + '</h3>'
      + '<div class="top-list">' + rows + '</div>'
      + '</div>';
  });

  grid.innerHTML = html;
}

// ══ أنشط الموظفين ══════════════════════════════════════════
function renderTopEmployees() {
  const stats = {};
  _txns.forEach(tx => {
    const by = tx.by || t('restore_unknown');
    if (!stats[by]) stats[by] = { dep:0, wit:0, trf:0, total:0 };
    if (tx.type==='dep') stats[by].dep++;
    else if (tx.type==='wit') stats[by].wit++;
    else if (tx.type==='trf') stats[by].trf++;
    stats[by].total++;
  });

  const sorted = Object.entries(stats)
    .sort((a,b) => b[1].total - a[1].total)
    .slice(0, 7);

  const el = document.getElementById('top-employees');
  if (!sorted.length) {
    el.innerHTML = `<div class="no-data">${t('no_ops_recorded')}</div>`;
    return;
  }
  el.innerHTML = sorted.map(([name, s], i) => `
    <div class="top-item">
      <div class="top-rank">${i+1}</div>
      <div class="top-name">${UI.escapeHtml(name)}</div>
      <div style="font-size:0.72rem;color:var(--text3);">
        ${t('emp_ops_summary', {dep:s.dep, wit:s.wit, trf:s.trf})}
      </div>
      <div class="top-val" style="color:var(--gold);">${s.total}</div>
    </div>`).join('');
}
</script>
</body>
</html>
