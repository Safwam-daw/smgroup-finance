<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="archived_title">حركات حساب مؤرشف</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.acc-hero {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px; margin-bottom:16px;
}
.acc-hero-top {
  display:flex; justify-content:space-between;
  align-items:flex-start; flex-wrap:wrap; gap:12px;
}
.acc-hero-name { font-size:1.15rem; font-weight:700; }
.acc-hero-meta { font-size:0.73rem; color:var(--text3); margin-top:4px; }
.bal-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.bal-box {
  flex:1; min-width:120px; padding:12px 16px;
  border-radius:var(--radius-sm); border:1px solid;
  display:flex; flex-direction:column; gap:4px;
}
.bal-box-label { font-size:0.67rem; color:var(--text3); }
.bal-box-val   { font-size:1.2rem; font-weight:700; }
.archived-banner {
  background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
  border-radius:var(--radius-sm); padding:10px 14px;
  font-size:0.82rem; color:var(--red); margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.quick-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.qf-btn {
  padding:6px 14px; border-radius:20px; border:1px solid var(--border2);
  background:transparent; color:var(--text2); font-size:0.76rem;
  font-family:inherit; cursor:pointer; transition:all .15s; white-space:nowrap;
}
.qf-btn:hover,.qf-btn.active { background:var(--gold-dim); color:var(--gold); border-color:var(--gold); }
.cell-credit { background:var(--green-dim); color:var(--green); font-weight:700;
  padding:3px 8px; border-radius:6px; display:inline-block; }
.cell-debit  { background:var(--red-dim); color:var(--red); font-weight:700;
  padding:3px 8px; border-radius:6px; display:inline-block; }
@media print {
  #sidebar,#topbar,#sidebar-overlay,#toast,#treasury-bar,
  #treasury-placeholder,.no-print,.quick-filters,
  .filter-card { display:none!important; }
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  body { background:#fff!important; color:#111!important; }
  #main { margin:0!important; padding:16px!important; }
  .acc-hero { background:#fff!important; border:2px solid #c9a84c!important; }
  .bal-box  { background:#fffbef!important; border-color:#c9a84c!important; }
  table { min-width:unset!important; width:100%!important; font-size:0.79rem; }
  th { background:#f5f0e0!important; color:#333!important; border-bottom:2px solid #c9a84c!important; }
  td { border-bottom:1px solid #eee!important; color:#111!important; }
  .cell-credit { background:#e8f8ef!important; color:#16a34a!important; }
  .cell-debit  { background:#fef2f2!important; color:#dc2626!important; }
}
</style>
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>

    <!-- شريط الأرشيف -->
    <div class="archived-banner">
      🗄️ <span id="archive-banner-text" data-i18n="archived_banner">هذا حساب مؤرشف — للعرض فقط، لا يمكن إجراء أي عمليات عليه</span>
    </div>

    <!-- بطاقة الحساب -->
    <div class="acc-hero" id="acc-hero">
      <div class="acc-hero-top">
        <div>
          <div class="acc-hero-name" id="hero-name">جاري التحميل…</div>
          <div class="acc-hero-meta" id="hero-meta"></div>
        </div>
        <div class="btn-group no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ طباعة</button>
          <button class="btn btn-ghost btn-sm" onclick="exportMovements()">📊 Excel</button>
          <button class="btn btn-ghost btn-sm" onclick="history.back()">← رجوع</button>
        </div>
      </div>
      <!-- أرصدة وقت الحذف -->
      <div class="bal-row" id="bal-row">
        <div class="bal-box" style="border-color:var(--gold);background:var(--gold-dim2);">
          <div class="bal-box-label" data-i18n="bal_at_delete">🇺🇸 رصيد الدولار وقت الحذف</div>
          <div class="bal-box-val" id="bal-usd" style="color:var(--gold);">—</div>
        </div>
        <div class="bal-box" style="border-color:var(--euro);background:var(--euro-dim);">
          <div class="bal-box-label" data-i18n="bal_eur_delete">🇪🇺 رصيد اليورو وقت الحذف</div>
          <div class="bal-box-val" id="bal-eur" style="color:var(--euro);">—</div>
        </div>
      </div>
    </div>

    <!-- فلاتر -->
    <div class="card filter-card" style="padding:14px 16px;margin-bottom:14px;">
      <div class="quick-filters">
        <button class="qf-btn active" onclick="setQuick('all')">الكل</button>
        <button class="qf-btn" onclick="setQuick('month')">هذا الشهر</button>
        <button class="qf-btn" onclick="setQuick('today')">اليوم</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px;">
        <div class="form-group" style="flex:1;min-width:110px;margin-bottom:0;"><label data-i18n="col_type_lbl">النوع</label>
          <select id="f-type" onchange="renderRows()">
            <option value="all">الكل</option>
            <option value="dep">إيداع</option>
            <option value="wit">سحب</option>
            <option value="trf">تحويل</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:110px;margin-bottom:0;"><label data-i18n="filter_currency">العملة</label>
          <select id="f-cur" onchange="renderRows()">
            <option value="all">الكل</option>
            <option value="usd">دولار</option>
            <option value="eur">يورو</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;"><label data-i18n="from_date">من تاريخ</label>
          <input type="date" id="f-from" onchange="clearQuick();renderRows()">
        </div>
        <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;"><label data-i18n="to_date">إلى تاريخ</label>
          <input type="date" id="f-to" onchange="clearQuick();renderRows()">
        </div>
      </div>
    </div>

    <!-- جدول الحركات -->
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="tbl-wrap" style="border:none;border-radius:0;margin:0;">
        <table id="mov-table">
          <thead><tr>
            <th data-i18n="col_date">التاريخ</th><th data-i18n="col_type_lbl">النوع</th><th data-i18n="col_counterpart">الطرف الآخر</th>
            <th data-i18n="col_currency">العملة</th><th data-i18n="col_debit_lbl">دين</th><th data-i18n="col_credit_lbl">دائن</th><th data-i18n="col_note">ملاحظة</th>
          </tr></thead>
          <tbody id="mov-tbody">
            <tr><td colspan="7" class="empty-state">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div style="margin-top:10px;">
      <span id="txn-count" style="font-size:0.74rem;color:var(--text3);"></span>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
let _archiveId = null;
let _archiveAcc = null;
let _allTxns = [];
let _filtered = [];

(async () => {
  if (!await initApp('accounts')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();

  // قراءة رقم الأرشيف من URL
  const params = new URLSearchParams(location.search);
  _archiveId = params.get('acc');
  if (!_archiveId) { navTo('reports.html'); return; }

  // جلب بيانات الحساب المحذوف
  const { data: deleted } = await window._sb
    .from('deleted_accounts')
    .select('*')
    .eq('archive_id', _archiveId)
    .single();

  if (!deleted) {
    UI.toast('لم يتم العثور على الحساب المؤرشف', 'error');
    setTimeout(() => navTo('reports.html'), 1500);
    return;
  }

  _archiveAcc = deleted;

  // عرض بيانات الحساب
  const typeLabel = deleted.type === 'company' ? 'شركة' : 'زبون';
  document.getElementById('hero-name').textContent =
    `🗄️ ${deleted.name} · أرشيف ${_archiveId}`;
  document.getElementById('hero-meta').textContent =
    `الرقم الأصلي: ${deleted.id} · النوع: ${typeLabel} · حُذف بواسطة: ${deleted.deleted_by || '—'} · بتاريخ: ${deleted.deleted_at ? UI.formatDate(deleted.deleted_at) : '—'}`;

  const usd = parseFloat(deleted.bal_usd || 0);
  const eur = parseFloat(deleted.bal_eur || 0);
  const usdEl = document.getElementById('bal-usd');
  const eurEl = document.getElementById('bal-eur');
  usdEl.textContent = '$' + usd.toFixed(2);
  usdEl.style.color = usd < 0 ? 'var(--red)' : 'var(--gold)';
  eurEl.textContent = '€' + eur.toFixed(2);
  eurEl.style.color = eur < 0 ? 'var(--red)' : 'var(--euro)';

  if (deleted.transfer_note) {
    document.getElementById('archive-banner-text').textContent =
      `🗄️ حساب مؤرشف — للعرض فقط · ${deleted.transfer_note}`;
  }

  // جلب الحركات برقم الأرشيف (7001 إلخ)
  UI.showLoading(true);
  const txns = await Storage.getTxns({ acc: _archiveId });
  _allTxns = txns || [];
  UI.showLoading(false);

  renderRows();
})();

function setQuick(key) {
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
  const today = UI.todayStr();
  const map = {
    all:   { from: '', to: '' },
    month: { from: UI.firstOfMonth(0), to: UI.lastOfMonth(0) },
    today: { from: today, to: today }
  };
  const r = map[key] || map.all;
  document.getElementById('f-from').value = r.from;
  document.getElementById('f-to').value   = r.to;
  const idx = { all:0, month:1, today:2 }[key];
  document.querySelectorAll('.qf-btn')[idx]?.classList.add('active');
  renderRows();
}
function clearQuick() {
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
}

function renderRows() {
  const fType = document.getElementById('f-type').value;
  const fCur  = document.getElementById('f-cur').value;
  const fFrom = document.getElementById('f-from').value;
  const fTo   = document.getElementById('f-to').value;

  _filtered = _allTxns.filter(t => {
    if (t.is_commission_entry) return false;
    if (fType !== 'all' && t.type !== fType) return false;
    if (fCur  !== 'all' && t.cur  !== fCur)  return false;
    if (fFrom && new Date(t.date) < new Date(fFrom)) return false;
    if (fTo   && new Date(t.date) > new Date(fTo + 'T23:59:59')) return false;
    return true;
  });

  const typeLabels = { dep:'إيداع', wit:'سحب', trf:'تحويل', fee:'عمولة' };
  const typeBadge  = { dep:'badge-dep', wit:'badge-wit', trf:'badge-trf', fee:'badge-fee' };

  const tbody = document.getElementById('mov-tbody');
  if (!_filtered.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="empty-icon">📭</div>لا توجد حركات</td></tr>';
    document.getElementById('txn-count').textContent = '';
    return;
  }

  tbody.innerHTML = _filtered.map(t => {
    const isFrom = t.from === _archiveId;
    const isTo   = t.to   === _archiveId;
    const isAcc  = t.acc  === _archiveId;

    let debit = '', credit = '', other = '—';
    const amt = parseFloat(t.amt || 0);
    const cur = (t.cur || 'usd').toUpperCase();

    if (t.type === 'dep') {
      credit = `<span class="cell-credit">+${amt.toFixed(2)} ${cur}</span>`;
    } else if (t.type === 'wit') {
      debit = `<span class="cell-debit">−${amt.toFixed(2)} ${cur}</span>`;
    } else if (t.type === 'trf') {
      if (isFrom) {
        debit = `<span class="cell-debit">−${amt.toFixed(2)} ${cur}</span>`;
        other = UI.escapeHtml(t.to || '—');
      } else {
        const received = (t.rate && t.rate !== 1)
          ? (amt * t.rate).toFixed(2)
          : amt.toFixed(2);
        credit = `<span class="cell-credit">+${received} ${cur}</span>`;
        other = UI.escapeHtml(t.from || '—');
      }
    }

    return `<tr>
      <td style="font-size:0.71rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
      <td><span class="badge ${typeBadge[t.type]||''}" style="font-size:0.72rem;">${typeLabels[t.type]||t.type}</span></td>
      <td style="font-size:0.78rem;">${UI.escapeHtml(other)}</td>
      <td style="font-size:0.78rem;">${cur}</td>
      <td>${debit}</td>
      <td>${credit}</td>
      <td style="font-size:0.74rem;color:var(--text3);">${UI.escapeHtml(t.note||'')}</td>
    </tr>`;
  }).join('');

  document.getElementById('txn-count').textContent =
    `${_filtered.length} حركة`;
}

function exportMovements() {
  if (typeof XLSX === 'undefined') { UI.toast('مكتبة Excel غير محملة', 'error'); return; }
  const wb = XLSX.utils.table_to_book(document.getElementById('mov-table'), { sheet:'الحركات' });
  const name = _archiveAcc ? _archiveAcc.name : _archiveId;
  XLSX.writeFile(wb, 'أرشيف_' + name + '_' + UI.todayStr() + '.xlsx');
}
</script>
</body>
</html>
