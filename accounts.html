<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — إدارة الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div><h2>إدارة الحسابات</h2><p>إنشاء ومتابعة حسابات الزبائن والشركات</p></div>
      <button class="btn btn-primary no-print" onclick="UI.exportExcel('acc-table','Accounts_List')">📊 تصدير Excel</button>
    </div>

    <!-- فتح حساب جديد (مدير فقط) -->
    <div class="card" id="create-card" style="margin-bottom:16px;">
      <h3>➕ فتح حساب جديد</h3>
      <div class="grid-2">
        <div>
          <div class="form-group"><label>نوع الحساب</label>
            <select id="acc-type" onchange="refreshCode()">
              <option value="customer">زبون</option>
              <option value="company">شركة</option>
            </select>
          </div>
          <div class="form-group"><label>كود الحساب (تلقائي)</label>
            <input type="text" id="acc-code" readonly>
          </div>
        </div>
        <div>
          <div class="form-group"><label>اسم الحساب</label>
            <input type="text" id="acc-name" placeholder="اسم الزبون أو الشركة">
          </div>
          <button class="btn btn-primary btn-full" style="margin-top:6px;" onclick="doCreate()">💾 حفظ الحساب</button>
        </div>
      </div>
    </div>

    <!-- فلاتر البحث -->
    <div class="card" style="margin-bottom:16px;padding:14px 16px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="flex:2;min-width:160px;margin-bottom:0;"><label>بحث سريع</label>
          <input type="text" id="filter-input" placeholder="اسم أو كود…" oninput="filterChanged()">
        </div>
        <div class="form-group" style="flex:1;min-width:120px;margin-bottom:0;"><label>النوع</label>
          <select id="filter-type" onchange="filterChanged()">
            <option value="all">الكل</option>
            <option value="customer">زبائن</option>
            <option value="company">شركات</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;"><label>الرصيد</label>
          <select id="filter-bal" onchange="filterChanged()">
            <option value="all">الكل</option>
            <option value="debtor">مدينون ⚠️</option>
          </select>
        </div>
      </div>
    </div>

    <!-- جدول الحسابات -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin-bottom:0;">قائمة الحسابات</h3>
        <span id="acc-count" style="font-size:0.75rem;color:var(--text3);"></span>
      </div>
      <div class="tbl-wrap">
        <table id="acc-table">
          <thead><tr>
            <th>الكود</th><th>الاسم</th><th>النوع</th>
            <th>رصيد $</th><th>رصيد €</th><th>كشف</th>
          </tr></thead>
          <tbody id="acc-tbody"><tr><td colspan="6" class="empty-state">جاري التحميل…</td></tr></tbody>
        </table>
      </div>
      <div class="pagination no-print" id="acc-pages"></div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
const PAGE_SIZE = 10;
let _filteredList = [];
let _currentPage  = 1;

(async () => {
  if (!await initApp('accounts')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  if (!Auth.isAdmin()) document.getElementById('create-card').style.display='none';
  await refreshCode();
  await buildList();
})();

async function refreshCode() {
  document.getElementById('acc-code').value =
    await Accounts.generateCode(document.getElementById('acc-type').value);
}

async function doCreate() {
  const type = document.getElementById('acc-type').value;
  const name = document.getElementById('acc-name').value;
  UI.showLoading(true);
  const result = await Accounts.create(type, name);
  UI.showLoading(false);
  if (result.ok) {
    UI.toast('تم إنشاء الحساب: ' + result.id);
    document.getElementById('acc-name').value = '';
    await refreshCode();
    await buildList();
    await UI.updateTreasury();
  } else { UI.toast(result.error,'error'); }
}

// بناء القائمة الكاملة مع الأرصدة
async function buildList() {
  UI.showLoading(true);
  const all = await Accounts.getAll();
  // نجلب الأرصدة مرة واحدة
  _filteredList = await Promise.all(all.map(async a => ({
    ...a,
    usd: await Storage.getBalance(a.id,'usd'),
    eur: await Storage.getBalance(a.id,'eur')
  })));
  UI.showLoading(false);
  filterChanged();
}

function filterChanged() {
  const q    = document.getElementById('filter-input').value.toLowerCase();
  const type = document.getElementById('filter-type').value;
  const bal  = document.getElementById('filter-bal').value;
  let list = _filteredList;
  if (q)         list = list.filter(a => a.id.includes(q)||a.name.toLowerCase().includes(q));
  if (type!=='all') list = list.filter(a => a.type===type);
  if (bal==='debtor') list = list.filter(a => a.usd<0||a.eur<0);
  _filteredList = list; // تصفية مؤقتة
  // لا نريد تعديل المصفوفة الأصلية — أعد البناء
  applyFilter();
}

let _filtered = [];
async function applyFilter() {
  const all = await Accounts.getAll();
  const q    = document.getElementById('filter-input').value.toLowerCase();
  const type = document.getElementById('filter-type').value;
  const bal  = document.getElementById('filter-bal').value;
  _filtered = all.filter(a => {
    if (q && !a.id.includes(q) && !a.name.toLowerCase().includes(q)) return false;
    if (type!=='all' && a.type!==type) return false;
    return true;
  });
  // إذا فلتر بالرصيد نحتاج الأرصدة
  if (bal==='debtor') {
    const withBal = await Promise.all(_filtered.map(async a => ({
      ...a, usd:await Storage.getBalance(a.id,'usd'), eur:await Storage.getBalance(a.id,'eur')
    })));
    _filtered = withBal.filter(a => a.usd<0||a.eur<0);
  }
  _currentPage = 1;
  await renderPage();
}

async function renderPage() {
  const total = _filtered.length;
  const totalPages = Math.ceil(total/PAGE_SIZE)||1;
  const page = _filtered.slice((_currentPage-1)*PAGE_SIZE, _currentPage*PAGE_SIZE);

  // نجلب الأرصدة للصفحة الحالية فقط
  const rows = await Promise.all(page.map(async a => {
    const usd = a.usd!==undefined ? a.usd : await Storage.getBalance(a.id,'usd');
    const eur = a.eur!==undefined ? a.eur : await Storage.getBalance(a.id,'eur');
    const debtor = usd<0||eur<0;
    return `<tr class="${debtor?'row-debtor':''}">
      <td style="font-weight:700;">${UI.escapeHtml(a.id)}${debtor?' ⚠️':''}</td>
      <td>${UI.escapeHtml(a.name)}</td>
      <td><span class="badge-type">${a.type==='company'?'شركة':'زبون'}</span></td>
      <td style="color:${usd<0?'var(--red)':'var(--text)'};font-weight:600;">${usd.toFixed(2)}</td>
      <td style="color:${eur<0?'var(--red)':'var(--text)'};font-weight:600;">${eur.toFixed(2)}</td>
      <td><button class="btn btn-ghost btn-sm no-print"
            onclick="navTo('statement.html?acc=${UI.escapeHtml(a.id)}')">📋 كشف</button></td>
    </tr>`;
  }));

  document.getElementById('acc-tbody').innerHTML =
    rows.length ? rows.join('') :
    '<tr><td colspan="6" class="empty-state"><div class="empty-icon">👥</div>لا توجد نتائج</td></tr>';

  document.getElementById('acc-count').textContent = total + ' حساب';

  // Pagination
  const pg = document.getElementById('acc-pages');
  if (totalPages<=1) { pg.innerHTML=''; return; }
  pg.innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="goPage(${_currentPage-1})" ${_currentPage===1?'disabled':''}>‹ السابق</button>
    <span>${_currentPage} / ${totalPages}</span>
    <button class="btn btn-ghost btn-sm" onclick="goPage(${_currentPage+1})" ${_currentPage===totalPages?'disabled':''}>التالي ›</button>`;
}

async function goPage(p) {
  const totalPages = Math.ceil(_filtered.length/PAGE_SIZE)||1;
  if (p<1||p>totalPages) return;
  _currentPage = p;
  await renderPage();
}

// تشغيل الفلتر عند البداية
(async()=>{ await applyFilter(); })();
</script>
</body>
</html>
