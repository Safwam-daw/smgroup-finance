<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — إدارة الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div><h2>إدارة الحسابات</h2><p>إنشاء ومتابعة حسابات الزبائن والشركات</p></div>
      <button class="btn btn-primary no-print" onclick="UI.exportExcel('acc-table','Accounts_List')">📊 Excel</button>
    </div>

    <!-- فتح حساب جديد (مدير فقط) -->
    <div class="card" id="create-card" style="margin-bottom:16px;">
      <h3>➕ فتح حساب جديد</h3>
      <div class="grid-2">
        <div>
          <div class="form-group"><label>نوع الحساب</label>
            <select id="acc-type" onchange="refreshCode()">
              <option value="customer">زبون</option>
              <option value="company">شركة</option>
            </select>
          </div>
          <div class="form-group"><label>كود الحساب (تلقائي)</label>
            <input type="text" id="acc-code" readonly>
          </div>
        </div>
        <div>
          <div class="form-group"><label>اسم الحساب</label>
            <input type="text" id="acc-name" placeholder="اسم الزبون أو الشركة"
                   onkeydown="if(event.key==='Enter') doCreate()">
          </div>
          <button class="btn btn-primary btn-full" style="margin-top:6px;" onclick="doCreate()">💾 حفظ الحساب</button>
        </div>
      </div>
    </div>

    <!-- فلاتر -->
    <div class="card" style="margin-bottom:16px;padding:14px 16px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="flex:2;min-width:160px;margin-bottom:0;"><label>بحث سريع</label>
          <input type="text" id="filter-input" placeholder="اسم أو كود…" oninput="applyFilter()">
        </div>
        <div class="form-group" style="flex:1;min-width:120px;margin-bottom:0;"><label>النوع</label>
          <select id="filter-type" onchange="applyFilter()">
            <option value="all">الكل</option>
            <option value="customer">زبائن</option>
            <option value="company">شركات</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;"><label>الرصيد</label>
          <select id="filter-bal" onchange="applyFilter()">
            <option value="all">الكل</option>
            <option value="debtor">مدينون ⚠️</option>
          </select>
        </div>
      </div>
    </div>

    <!-- جدول الحسابات -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin-bottom:0;">قائمة الحسابات</h3>
        <span id="acc-count" style="font-size:0.75rem;color:var(--text3);"></span>
      </div>
      <div class="tbl-wrap">
        <table id="acc-table">
          <thead><tr>
            <th>الكود</th><th>الاسم</th><th>النوع</th>
            <th>رصيد $</th><th>رصيد €</th><th>إجراءات</th>
          </tr></thead>
          <tbody id="acc-tbody">
            <tr><td colspan="6" class="empty-state">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination no-print" id="acc-pages"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
const PAGE_SIZE  = 15;
let _allAccounts = [];  // القائمة الكاملة مع الأرصدة
let _filtered    = [];
let _page        = 1;

(async () => {
  if (!await initApp('accounts')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  if (!Auth.isAdmin()) document.getElementById('create-card').style.display='none';
  await refreshCode();
  await loadAccounts();
})();

// تحميل الحسابات مع الأرصدة من الـ Cache مرة واحدة
async function loadAccounts() {
  UI.showLoading(true);
  const raw = await Accounts.getAll();
  // الأرصدة موجودة في الكائن مباشرة من Supabase (bal_usd, bal_eur)
  _allAccounts = raw.map(a => ({
    ...a,
    usd: parseFloat(a.bal_usd || 0),
    eur: parseFloat(a.bal_eur || 0)
  }));
  UI.showLoading(false);
  applyFilter();
}

async function refreshCode() {
  document.getElementById('acc-code').value =
    await Accounts.generateCode(document.getElementById('acc-type').value);
}

async function doCreate() {
  const type = document.getElementById('acc-type').value;
  const name = document.getElementById('acc-name').value;
  UI.showLoading(true);
  const result = await Accounts.create(type, name);
  UI.showLoading(false);
  if (result.ok) {
    UI.toast('تم إنشاء الحساب: ' + result.id);
    document.getElementById('acc-name').value = '';
    await refreshCode();
    await loadAccounts();
    await UI.updateTreasury();
  } else { UI.toast(result.error,'error'); }
}

function applyFilter() {
  const q    = document.getElementById('filter-input').value.toLowerCase().trim();
  const type = document.getElementById('filter-type').value;
  const bal  = document.getElementById('filter-bal').value;

  _filtered = _allAccounts.filter(a => {
    if (q && !a.id.toLowerCase().includes(q) && !a.name.toLowerCase().includes(q)) return false;
    if (type !== 'all' && a.type !== type) return false;
    if (bal === 'debtor' && a.usd >= 0 && a.eur >= 0) return false;
    return true;
  });
  _page = 1;
  renderPage();
}

function renderPage() {
  const total      = _filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  const start      = (_page - 1) * PAGE_SIZE;
  const pagItems   = _filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('acc-count').textContent = total + ' حساب';

  const tbody = document.getElementById('acc-tbody');
  if (!pagItems.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="empty-icon">👥</div>لا توجد نتائج</td></tr>';
    document.getElementById('acc-pages').innerHTML = '';
    return;
  }

  tbody.innerHTML = pagItems.map(a => {
    const debtor = a.usd < 0 || a.eur < 0;
    return `<tr class="${debtor ? 'row-debtor' : ''}" style="cursor:pointer;"
              onclick="navTo('account-view.html?acc=${a.id}')">
      <td style="font-weight:700;">${UI.escapeHtml(a.id)}${debtor ? ' ⚠️' : ''}</td>
      <td>${UI.escapeHtml(a.name)}</td>
      <td><span class="badge-type">${a.type === 'company' ? 'شركة' : 'زبون'}</span></td>
      <td style="color:${a.usd<0?'var(--red)':'var(--text)'};font-weight:600;">${a.usd.toFixed(2)}</td>
      <td style="color:${a.eur<0?'var(--red)':'var(--text)'};font-weight:600;">${a.eur.toFixed(2)}</td>
      <td onclick="event.stopPropagation();" style="white-space:nowrap;">
        <button class="btn btn-ghost btn-sm"
          onclick="navTo('account-view.html?acc=${a.id}')">👁️ حركات</button>
        <button class="btn btn-ghost btn-sm"
          onclick="navTo('statement.html?acc=${a.id}')">📋 كشف</button>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  const pg = document.getElementById('acc-pages');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  let html = `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page-1})" ${_page===1?'disabled':''}>‹</button>`;
  const sp = Math.max(1, _page-2), ep = Math.min(totalPages, _page+2);
  if (sp > 1) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(1)">1</button>`;
  if (sp > 2) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
  for (let i = sp; i <= ep; i++)
    html += `<button class="btn btn-sm ${i===_page?'btn-primary':'btn-ghost'}" onclick="goPage(${i})">${i}</button>`;
  if (ep < totalPages-1) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
  if (ep < totalPages)   html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page+1})" ${_page===totalPages?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  const t = Math.ceil(_filtered.length / PAGE_SIZE) || 1;
  if (p < 1 || p > t) return;
  _page = p;
  renderPage();
}
// ── حذف الحساب من القائمة ─────────────────────────────
let _delAccId = null;
function confirmDelAcc(id, name) {
  _delAccId = id;
  const usd = _filteredList.find(a=>a.id===id)?.usd || 0;
  const eur = _filteredList.find(a=>a.id===id)?.eur || 0;
  document.getElementById('del-acc-name').textContent = name + ' (' + id + ')';
  document.getElementById('del-acc-bal').textContent =
    `$${usd.toFixed(2)} | €${eur.toFixed(2)}`;
  document.getElementById('del-acc-bal').style.color =
    (usd < 0 || eur < 0) ? 'var(--red)' : 'var(--text2)';
  document.getElementById('del-acc-modal').style.display = 'flex';
}

function closeDelAcc() {
  document.getElementById('del-acc-modal').style.display = 'none';
  _delAccId = null;
}

async function doDelAcc() {
  UI.showLoading(true);
  const result = await Storage.deleteAccount(_delAccId, Auth.getUser().user);
  UI.showLoading(false);
  closeDelAcc();
  if (result.ok) {
    let msg = 'تم حذف الحساب ✅';
    if (result.usd !== 0 || result.eur !== 0)
      msg += ` · رصيد ($${result.usd.toFixed(2)} | €${result.eur.toFixed(2)}) حُوِّل للأرباح`;
    UI.toast(msg);
    await buildList();
    await UI.updateTreasury();
  } else { UI.toast(result.error, 'error'); }
}
</script>

<!-- Modal حذف الحساب -->
<div id="del-acc-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
     z-index:1000;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:100%;max-width:420px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:10px;">⚠️</div>
    <h3 style="color:var(--red);">حذف الحساب</h3>
    <p style="color:var(--text2);font-size:0.85rem;margin:14px 0;">
      <b id="del-acc-name" style="color:var(--text);"></b><br>
      الرصيد الحالي: <b id="del-acc-bal"></b><br><br>
      سيُحوَّل الرصيد تلقائياً لحساب الأرباح.<br>
      <b style="color:var(--red);">لا يمكن التراجع.</b>
    </p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn btn-ghost" onclick="closeDelAcc()">إلغاء</button>
      <button class="btn btn-danger" onclick="doDelAcc()">🗑️ حذف</button>
    </div>
  </div>
</div>

</body>
</html>
