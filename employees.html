<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — إدارة الموظفين</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header"><div><h2>🛡️ إدارة الموظفين</h2><p>إضافة المستخدمين وضبط الصلاحيات</p></div></div>
    <div class="grid-2">
      <div class="card">
        <h3>➕ إضافة موظف جديد</h3>
        <div class="form-group"><label>اسم المستخدم</label>
          <input type="text" id="emp-user" placeholder="اسم المستخدم" autocomplete="off"></div>
        <div class="form-group"><label>كلمة المرور</label>
          <input type="password" id="emp-pass" placeholder="كلمة المرور" autocomplete="new-password"></div>
        <div class="form-group"><label>تأكيد كلمة المرور</label>
          <input type="password" id="emp-pass2" placeholder="أعد كتابة كلمة المرور"></div>
        <div class="form-group"><label>الصلاحية</label>
          <select id="emp-role">
            <option value="employee">موظف — العمليات فقط</option>
            <option value="admin">مدير — كافة الصلاحيات</option>
          </select>
        </div>
        <button class="btn btn-primary btn-full" onclick="doAdd()">💾 حفظ الموظف</button>
        <div style="margin-top:16px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:14px;">
          <p style="font-size:0.75rem;color:var(--text2);line-height:1.7;">
            <b style="color:var(--text);">🔐 ملاحظة:</b> كلمات المرور محفوظة بـ Base64 —
            مناسب للبيئة الداخلية. للإنتاج استخدم bcrypt مع backend.
          </p>
        </div>
      </div>
      <div class="card">
        <h3>الموظفون المسجلون</h3>
        <div class="tbl-wrap">
          <table><thead><tr><th>المستخدم</th><th>الصلاحية</th><th>الإجراء</th></tr></thead>
          <tbody id="emp-tbody"><tr><td colspan="3" class="empty-state">جاري التحميل…</td></tr></tbody></table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:100%;max-width:380px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;">🗑️</div>
    <h3>تأكيد الحذف</h3>
    <p id="del-msg" style="color:var(--text2);margin:14px 0;font-size:0.87rem;"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeDel()">إلغاء</button>
      <button class="btn btn-danger" id="del-confirm-btn">حذف</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  if (!await initApp('employees')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  await renderEmployees();
})();

async function doAdd() {
  const u  = document.getElementById('emp-user').value.trim();
  const p  = document.getElementById('emp-pass').value.trim();
  const p2 = document.getElementById('emp-pass2').value.trim();
  const r  = document.getElementById('emp-role').value;
  if (!u) { UI.toast('أدخل اسم المستخدم','error'); return; }
  if (!p) { UI.toast('أدخل كلمة المرور','error'); return; }
  if (p !== p2) { UI.toast('كلمتا المرور غير متطابقتين','error'); return; }
  UI.showLoading(true);
  const users = await Storage.getUsers();
  if (users.find(x => x.username === u)) { UI.showLoading(false); UI.toast('اسم المستخدم موجود بالفعل','error'); return; }
  const ok = await Storage.saveUser({ user: u, pass: btoa(p), role: r });
  UI.showLoading(false);
  if (ok) {
    document.getElementById('emp-user').value='';
    document.getElementById('emp-pass').value='';
    document.getElementById('emp-pass2').value='';
    UI.toast('تم إضافة الموظف ✅');
    await renderEmployees();
  } else { UI.toast('خطأ في الحفظ','error'); }
}

let _delId = null;
function confirmDel(id, username) {
  _delId = id;
  document.getElementById('del-msg').textContent = `هل تريد حذف المستخدم "${username}" بشكل نهائي؟`;
  document.getElementById('del-confirm-btn').onclick = doDelete;
  document.getElementById('del-modal').style.display='flex';
}
function closeDel() { _delId=null; document.getElementById('del-modal').style.display='none'; }

async function doDelete() {
  UI.showLoading(true);
  await Storage.deleteUser(_delId);
  UI.showLoading(false);
  closeDel();
  UI.toast('تم الحذف');
  await renderEmployees();
}

async function renderEmployees() {
  const users   = await Storage.getUsers();
  const current = Auth.getUser().user;
  document.getElementById('emp-tbody').innerHTML = users.map(u => `
    <tr>
      <td style="font-weight:600;">${UI.escapeHtml(u.username)}
        ${u.username===current?'<span style="font-size:0.68rem;color:var(--gold);"> (أنت)</span>':''}
      </td>
      <td><span class="badge ${u.role==='admin'?'badge-dep':'badge-trf'}">
        ${u.role==='admin'?'🛡️ مدير':'👤 موظف'}
      </span></td>
      <td>${u.username==='admin'
        ? '<span style="color:var(--text3);font-size:0.75rem;">محمي</span>'
        : `<button class="btn btn-danger btn-sm" onclick="confirmDel(${u.id},'${UI.escapeHtml(u.username)}')">حذف</button>`
      }</td>
    </tr>`).join('');
}
</script>
</body>
</html>
