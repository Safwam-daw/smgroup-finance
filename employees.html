<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="employees_title">🛡️ إدارة الموظفين</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.emp-card {
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:var(--radius); padding:16px 18px;
  margin-bottom:10px; transition:border-color .2s;
}
.emp-card:hover { border-color:var(--border); }
.emp-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.emp-avatar {
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; font-weight:700;
}
.emp-avatar.admin    { background:var(--gold-dim);  color:var(--gold);  border:1px solid var(--gold); }
.emp-avatar.employee { background:var(--blue-dim);  color:var(--blue);  border:1px solid var(--blue); }
.emp-info { flex:1; }
.emp-name { font-weight:700; font-size:0.9rem; }
.emp-meta { font-size:0.72rem; color:var(--text3); margin-top:2px; }
.emp-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* شبكة الصلاحيات */
.perm-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;
}
.perm-item {
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border2);
  border-radius:8px; padding:8px 12px; cursor:pointer;
  transition:all .15s;
}
.perm-item:hover { border-color:var(--gold); }
.perm-item input[type=checkbox] { width:16px; height:16px; accent-color:var(--gold); flex-shrink:0; }
.perm-item label { font-size:0.78rem; cursor:pointer; user-select:none; }
.perm-divider { grid-column:1/-1; border-top:1px solid var(--border); margin:4px 0; }

.modal-back { position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:16px; }
.modal-back.open { display:flex; }
.modal-box { background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);width:100%;max-width:520px;padding:24px;
  max-height:90vh;overflow-y:auto; }
.modal-box h3 { margin-bottom:18px; }

@media(max-width:640px){
  .emp-top { flex-wrap:wrap; }
  .emp-actions { width:100%; }
  .emp-actions .btn { flex:1; }
  .perm-grid { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div><h2 data-i18n="employees_title">🛡️ إدارة الموظفين</h2><p data-i18n="employees_subtitle">إضافة المستخدمين وضبط الصلاحيات</p></div>
    </div>

    <!-- إضافة موظف -->
    <div class="card" style="margin-bottom:16px;">
      <h3 data-i18n="add_employee_title">➕ إضافة موظف جديد</h3>
      <div class="grid-2">
        <div>
          <div class="form-group">
            <label data-i18n="username_label">اسم المستخدم</label>
            <input type="text" id="emp-user" data-i18n-placeholder="username_label" placeholder="اسم المستخدم" autocomplete="off">
          </div>
          <div class="form-group">
            <label data-i18n="role_label">الصلاحية الرئيسية</label>
            <select id="emp-role" onchange="toggleAdminPerms()">
              <option value="employee" data-i18n="role_employee">👤 موظف</option>
            </select>
          </div>
        </div>
        <div>
          <div class="form-group">
            <label data-i18n="password_label">كلمة المرور</label>
            <input type="password" id="emp-pass" data-i18n-placeholder="password_label" placeholder="كلمة المرور">
          </div>
          <div class="form-group">
            <label data-i18n="password_confirm">تأكيد كلمة المرور</label>
            <input type="password" id="emp-pass2" data-i18n-placeholder="retype_password_ph" placeholder="أعد كتابة كلمة المرور">
          </div>
        </div>
      </div>

      <!-- صلاحيات الموظف الجديد -->
      <div id="new-perms-box">
        <div style="font-size:0.78rem;color:var(--text2);margin-bottom:10px;margin-top:4px;" data-i18n="tab_perms_lbl">
          🔧 صلاحيات التبويبات
        </div>
        <div class="perm-grid" id="new-perm-grid"></div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;">
        <button class="btn btn-primary" onclick="doAdd()" style="min-width:160px;" data-i18n="save_employee">💾 إضافة الموظف</button>
        <span style="font-size:0.72rem;color:var(--text3);" data-i18n="passwords_encrypted">🔐 كلمات المرور مشفرة</span>
      </div>
    </div>

    <!-- قائمة الموظفين -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin-bottom:0;" data-i18n="employees_list">الموظفون المسجلون</h3>
        <span id="emp-count" style="font-size:0.75rem;color:var(--text3);"></span>
      </div>
      <div id="emp-list"><div class="empty-state" data-i18n="loading">جاري التحميل…</div></div>
    </div>
  </main>
</div>

<!-- Modal تعديل الصلاحيات -->
<div id="perm-modal" class="modal-back">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin-bottom:0;"><span data-i18n="edit_perms_for">🔧 تعديل صلاحيات</span> <span id="perm-emp-name"></span></h3>
      <button onclick="closePermModal()" style="background:none;border:none;color:var(--text2);font-size:1.3rem;cursor:pointer;">✕</button>
    </div>
    <input type="hidden" id="perm-uid">
    <div class="perm-grid" id="edit-perm-grid"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
      <button class="btn btn-ghost" onclick="closePermModal()" data-i18n="cancel_btn">إلغاء</button>
      <button class="btn btn-primary" onclick="savePerms()" data-i18n="save_perms_btn">💾 حفظ الصلاحيات</button>
    </div>
  </div>
</div>

<!-- Modal تغيير كلمة المرور -->
<div id="pass-modal" class="modal-back">
  <div class="modal-box">
    <h3 data-i18n="change_password_title">🔑 تغيير كلمة المرور</h3>
    <input type="hidden" id="pass-uid">
    <div class="form-group">
      <label data-i18n="new_password_label">كلمة المرور الجديدة</label>
      <input type="password" id="pass-new" data-i18n-placeholder="new_password_label" placeholder="كلمة المرور الجديدة">
    </div>
    <div class="form-group">
      <label data-i18n="password_confirm">تأكيد كلمة المرور</label>
      <input type="password" id="pass-new2" data-i18n-placeholder="retype_password_ph" placeholder="أعد كتابة كلمة المرور">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-ghost" onclick="closePass()" data-i18n="cancel_btn">إلغاء</button>
      <button class="btn btn-primary" onclick="savePass()" data-i18n="save_btn">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- Modal تأكيد الحذف -->
<div id="del-modal" class="modal-back">
  <div class="modal-box" style="text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;">🗑️</div>
    <h3 data-i18n="confirm_delete_title">تأكيد الحذف</h3>
    <p id="del-msg" style="color:var(--text2);margin:14px 0;font-size:0.87rem;"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeDel()" data-i18n="cancel_btn">إلغاء</button>
      <button class="btn btn-danger" onclick="doDelete()" data-i18n="delete_btn">🗑️ حذف</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
// تعريف الصلاحيات وتسمياتها
function getPermDefs() {
  return [
    { key:'dashboard',    label:'📊 '+t('nav_dashboard') },
    { key:'accounts',     label:'👥 '+t('nav_accounts') },
    { key:'deposit',      label:'💵 '+t('perm_deposit') },
    { key:'withdraw',     label:'💸 '+t('perm_withdraw') },
    { key:'transfer',     label:'🔄 '+t('perm_transfer') },
    { key:'ledger',       label:'📒 '+t('nav_ledger') },
    { key:'statement',    label:'📋 '+t('nav_statement') },
    { key:'employees',    label:'🛡️ '+t('nav_employees') },
    { key:'reports',      label:'📊 '+t('nav_reports') },
    { key:'audit',        label:'🔍 '+t('nav_audit') },
    { key:'DIVIDER' },
    { key:'viewTreasury', label:'💰 '+t('perm_view_treasury') },
    { key:'viewProfit',   label:'📈 '+t('perm_view_profit') },
    { key:'canDelete',    label:'🗑️ '+t('perm_can_delete') },
    { key:'canEdit',      label:'✏️ '+t('perm_can_edit') },
    { key:'exportBackup', label:'💾 '+t('perm_export_backup') },
    { key:'clientPortal', label:'👤 '+t('perm_client_portal') },
    { key:'viewAnalytics',     label:'📈 '+t('nav_analytics') },
    { key:'viewNotifications', label:'🔔 '+t('perm_view_notifications') },
    { key:'viewHistory',       label:'📝 '+t('nav_history') },
  ];
}

(async () => {
  if (!await initApp('employees')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  buildPermGrid('new-perm-grid', Auth.DEFAULT_PERMS);
  // فقط صاحب المنظومة يرى خيار إنشاء مدير مصغر
  if (Auth.isSuperAdmin()) {
    const roleSelect = document.getElementById('emp-role');
    const adminOpt = document.createElement('option');
    adminOpt.value = 'admin';
    adminOpt.textContent = '🛡️ ' + t('role_admin');
    roleSelect.appendChild(adminOpt);
  }
  await renderEmployees();
})();

// بناء شبكة الصلاحيات
function buildPermGrid(containerId, currentPerms, prefix='np') {
  const container = document.getElementById(containerId);
  container.innerHTML = getPermDefs().map((p,i) => {
    if (p.key==='DIVIDER') return `<div class="perm-divider"></div>`;
    const checked = currentPerms[p.key] ? 'checked' : '';
    return `<div class="perm-item">
      <input type="checkbox" id="${prefix}_${p.key}" ${checked}
             onchange="syncPermCheck('${prefix}','${p.key}')">
      <label for="${prefix}_${p.key}">${p.label}</label>
    </div>`;
  }).join('');
}

function syncPermCheck(prefix, key) {
  // لا شيء إضافي — القراءة تتم عند الحفظ
}

function getGridPerms(prefix) {
  const perms = {};
  getPermDefs().filter(p=>p.key!=='DIVIDER').forEach(p => {
    const el = document.getElementById(prefix + '_' + p.key);
    if (el) perms[p.key] = el.checked;
  });
  return perms;
}

function toggleAdminPerms() {
  // الصلاحيات تظهر دائماً — حتى للأدمن المصغر
  document.getElementById('new-perms-box').style.display = 'block';
}

// ── إضافة موظف ────────────────────────────────────────
async function doAdd() {
  const u  = document.getElementById('emp-user').value.trim();
  const p  = document.getElementById('emp-pass').value;
  const p2 = document.getElementById('emp-pass2').value;
  const r  = document.getElementById('emp-role').value;
  if (!u) { UI.toast(t('enter_username_err'),'error'); return; }
  if (!p) { UI.toast(t('enter_password_err'),'error'); return; }
  if (p!==p2) { UI.toast(t('passwords_mismatch'),'error'); return; }

  // فقط صاحب المنظومة (admin) يمكنه إنشاء أدمن جديد
  if (r==='admin' && Auth.getUser().user !== 'admin') {
    UI.toast(t('only_owner_create_admin'),'error'); return;
  }
  const perms = getGridPerms('np'); // الصلاحيات دائماً محددة يدوياً

  UI.showLoading(true);
  const users = await Storage.getUsers();
  if (users.find(x=>x.username===u)) {
    UI.showLoading(false); UI.toast(t('username_exists'),'error'); return;
  }
  const ok = await Storage.saveUser({ user:u, pass:p, role:r, permissions:perms });
  UI.showLoading(false);
  if (ok) {
    await Storage.logAction('add_employee',
      { username: u, role: r },
      null,
      { username: u, role: r, permissions: perms }
    );
    ['emp-user','emp-pass','emp-pass2'].forEach(id=>document.getElementById(id).value='');
    buildPermGrid('new-perm-grid', Auth.DEFAULT_PERMS);
    UI.toast(t('employee_added_toast'));
    await renderEmployees();
  } else { UI.toast(t('save_error'),'error'); }
}

// ── عرض الموظفين ───────────────────────────────────────
async function renderEmployees() {
  const users   = await Storage.getUsers();
  const current = Auth.getUser().user;
  document.getElementById('emp-count').textContent = users.length + ' ' + t('user_unit');
  const list = document.getElementById('emp-list');
  if (!users.length) { list.innerHTML=`<div class="empty-state">${t('no_employees')}</div>`; return; }

  list.innerHTML = users.map(u => {
    const isMe    = u.username===current;
    const isAdmin = u.role==='admin';
    const isRoot  = u.username==='admin';
    const perms   = u.permissions || Auth.DEFAULT_PERMS;
    const permCount = isAdmin ? t('all_permissions') :
      Object.values(perms).filter(Boolean).length + ' ' + t('permission_unit');

    // الأدمن الرئيسي محمي من الجميع
    // الأدمن المصغر لا يمكنه تعديل/حذف أدمن آخر
    const currentIsSuperAdmin = Auth.isSuperAdmin();
    const targetIsAdmin = u.role === 'admin';
    const canManage = !isRoot && (currentIsSuperAdmin || !targetIsAdmin);
    const actions = isRoot
      ? `<span style="font-size:0.74rem;color:var(--gold);padding:6px 10px;">👑 ${t('system_owner')}</span>`
      : !canManage
      ? `<span style="font-size:0.74rem;color:var(--text3);padding:6px 10px;">${t('protected_lbl')}</span>`
      : `<button class="btn btn-ghost btn-sm" onclick="openPermModal(${u.id},'${UI.escapeHtml(u.username)}')">🔧 ${t('permissions_lbl')}</button>
         <button class="btn btn-ghost btn-sm" onclick="openPass(${u.id})">🔑 ${t('password_lbl')}</button>
         <button class="btn btn-danger btn-sm" onclick="confirmDel(${u.id},'${UI.escapeHtml(u.username)}')">🗑️</button>`;

    return `<div class="emp-card">
      <div class="emp-top">
        <div class="emp-avatar ${isAdmin?'admin':'employee'}">${u.username.charAt(0).toUpperCase()}</div>
        <div class="emp-info">
          <div class="emp-name">
            ${UI.escapeHtml(u.username)}
            ${isMe?`<span style="font-size:0.68rem;color:var(--gold);margin-right:6px;">(${t('you_lbl')})</span>`:''}
          </div>
          <div class="emp-meta">
            <span style="color:${isRoot?'var(--gold)':isAdmin?'var(--euro)':'var(--blue)'};">${isRoot?'👑 '+t('role_owner'):isAdmin?'🛡️ '+t('role_admin'):'👤 '+t('role_employee')}</span>
            <span style="margin-right:8px;color:var(--text3);">·</span>
            <span style="color:var(--text3);">${permCount}</span>
          </div>
        </div>
        <div class="emp-actions">${actions}</div>
      </div>
    </div>`;
  }).join('');
}

// ── صلاحيات Modal ──────────────────────────────────────
let _permUid = null;
async function openPermModal(id, username) {
  _permUid = id;
  document.getElementById('perm-uid').value = id;
  document.getElementById('perm-emp-name').textContent = username;
  const users = await Storage.getUsers();
  const u = users.find(x=>x.id===id);
  const currentPerms = u?.permissions || Auth.DEFAULT_PERMS;
  buildPermGrid('edit-perm-grid', currentPerms, 'ep');
  document.getElementById('perm-modal').classList.add('open');
}
function closePermModal() { document.getElementById('perm-modal').classList.remove('open'); }

async function savePerms() {
  const perms = getGridPerms('ep');
  const users = await Storage.getUsers();
  const targetUser = users.find(x => x.id === _permUid);
  const oldPerms = targetUser?.permissions || Auth.DEFAULT_PERMS;
  UI.showLoading(true);
  const ok = await Storage.updateUserPermissions(_permUid, perms);
  UI.showLoading(false);
  if (ok) {
    await Storage.logAction('change_permissions',
      { target_user: targetUser?.username || _permUid },
      { permissions: oldPerms },
      { permissions: perms }
    );
    closePermModal(); UI.toast(t('perms_saved_toast'));
    await renderEmployees();
  } else { UI.toast(t('save_error'),'error'); }
}

// ── كلمة المرور ────────────────────────────────────────
let _passUid = null;
function openPass(id) {
  _passUid=id;
  document.getElementById('pass-new').value='';
  document.getElementById('pass-new2').value='';
  document.getElementById('pass-modal').classList.add('open');
}
function closePass() { document.getElementById('pass-modal').classList.remove('open'); }
async function savePass() {
  const p  = document.getElementById('pass-new').value;
  const p2 = document.getElementById('pass-new2').value;
  if (!p) { UI.toast(t('enter_password_err'),'error'); return; }
  if (p!==p2) { UI.toast(t('passwords_mismatch'),'error'); return; }
  const users = await Storage.getUsers();
  const targetUser = users.find(x => x.id === _passUid);
  UI.showLoading(true);
  const ok = await Storage.updateUserPass(_passUid, p);
  UI.showLoading(false);
  if (ok) {
    await Storage.logAction('change_password',
      { target_user: targetUser?.username || _passUid, changed_by: Auth.getUser()?.user }
    );
    closePass(); UI.toast(t('password_changed_toast'));
  }
  else { UI.toast(t('save_error'),'error'); }
}

// ── حذف ────────────────────────────────────────────────
let _delId = null;
function confirmDel(id, username) {
  _delId=id;
  document.getElementById('del-msg').textContent = t('confirm_delete_user_msg', {username});
  document.getElementById('del-modal').classList.add('open');
}
function closeDel() { document.getElementById('del-modal').classList.remove('open'); }
async function doDelete() {
  const users = await Storage.getUsers();
  const targetUser = users.find(x => x.id === _delId);
  UI.showLoading(true);
  await Storage.deleteUser(_delId);
  UI.showLoading(false);
  await Storage.logAction('delete_employee',
    { target_user: targetUser?.username || _delId, role: targetUser?.role },
    { username: targetUser?.username, role: targetUser?.role },
    null
  );
  closeDel(); UI.toast(t('deleted_toast'));
  await renderEmployees();
}
</script>
</body>
</html>
