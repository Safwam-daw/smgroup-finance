<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — تحويل أرصدة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header"><div><h2>🔄 تحويل أرصدة</h2><p>نقل رصيد بين حسابين</p></div></div>
    <div class="grid-2">
      <div class="card">
        <h3>بيانات التحويل</h3>
        <div class="form-group">
          <label>من حساب (المرسل)</label>
          <div class="search-wrap">
            <input type="text" id="trf-from-search" placeholder="ابحث…" autocomplete="off">
            <div id="trf-from-res" class="search-dropdown"></div>
          </div>
          <input type="hidden" id="trf-from-id">
        </div>
        <div class="form-group">
          <label>إلى حساب (المستقبل)</label>
          <div class="search-wrap">
            <input type="text" id="trf-to-search" placeholder="ابحث…" autocomplete="off">
            <div id="trf-to-res" class="search-dropdown"></div>
          </div>
          <input type="hidden" id="trf-to-id">
        </div>
        <div class="grid-2">
          <div class="form-group"><label>العملة</label>
            <select id="trf-cur" onchange="updatePreview()">
              <option value="usd">🇺🇸 دولار USD</option>
              <option value="eur">🇪🇺 يورو EUR</option>
            </select>
          </div>
          <div class="form-group"><label>سعر الصرف</label>
            <input type="number" id="trf-rate" placeholder="1.00" value="1" step="0.0001" min="0" oninput="updatePreview()">
          </div>
        </div>
        <div class="form-group"><label>المبلغ</label>
          <input type="number" id="trf-amount" placeholder="0.00" min="0" step="0.01" oninput="updatePreview()">
        </div>
        <div id="trf-preview" style="display:none;border-radius:8px;padding:14px;margin-bottom:16px;font-size:0.83rem;background:var(--surface2);border:1px solid var(--border2);">
          <div id="trf-prev-from" style="margin-bottom:8px;"></div>
          <div id="trf-prev-to"></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="doTransfer(false)">🔄 تنفيذ التحويل</button>
      </div>
      <div class="card">
        <h3>آخر التحويلات</h3>
        <div class="tbl-wrap">
          <table><thead><tr><th>الوقت</th><th>من</th><th>إلى</th><th>المبلغ</th></tr></thead>
          <tbody id="recent-trf-tbody"><tr><td colspan="4" class="empty-state">جاري التحميل…</td></tr></tbody></table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="overdraft-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:100%;max-width:420px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
    <h3>رصيد المرسل غير كافٍ</h3>
    <p id="overdraft-msg" style="color:var(--text2);margin:14px 0;font-size:0.87rem;line-height:1.6;"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeOverdraft()">إلغاء</button>
      <button class="btn btn-danger" onclick="doTransfer(true)">المتابعة بالسالب</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  if (!await initApp('transfer')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  UI.initSearch('trf-from');
  UI.initSearch('trf-to');
  ['trf-from-res','trf-to-res'].forEach(id =>
    document.getElementById(id).addEventListener('click', () => setTimeout(updatePreview, 100)));
  await renderRecent();
})();

async function updatePreview() {
  const fromId = document.getElementById('trf-from-id').value;
  const toId   = document.getElementById('trf-to-id').value;
  const cur    = document.getElementById('trf-cur').value;
  const amt    = parseFloat(document.getElementById('trf-amount').value) || 0;
  const rate   = parseFloat(document.getElementById('trf-rate').value) || 1;
  const preview = document.getElementById('trf-preview');
  if (!fromId || !toId || amt <= 0) { preview.style.display='none'; return; }
  const sym = cur==='usd'?'$':'€';
  const fromBal = await Transactions.getBalance(fromId, cur);
  const newFrom = fromBal - amt;
  const received = amt * rate;
  document.getElementById('trf-prev-from').innerHTML =
    `<span style="color:var(--text2);">المرسل — قبل:</span> <b>${sym}${fromBal.toFixed(2)}</b>
     &nbsp;→&nbsp; <b style="color:${newFrom<0?'var(--red)':'var(--text)'};">${sym}${newFrom.toFixed(2)}</b>`;
  document.getElementById('trf-prev-to').innerHTML =
    `<span style="color:var(--text2);">المستقبل يستلم:</span>
     <b style="color:var(--green);">+${sym}${received.toFixed(2)}</b>
     ${rate!==1?`<span style="color:var(--text3);font-size:0.75rem;"> (×${rate})</span>`:''}`;
  preview.style.display='block';
}

async function doTransfer(force) {
  const from = document.getElementById('trf-from-id').value;
  const to   = document.getElementById('trf-to-id').value;
  const cur  = document.getElementById('trf-cur').value;
  const amt  = parseFloat(document.getElementById('trf-amount').value);
  const rate = parseFloat(document.getElementById('trf-rate').value) || 1;
  UI.showLoading(true);
  const result = await Transactions.transfer(from, to, cur, amt, rate, force);
  UI.showLoading(false);
  if (result.ok) {
    UI.toast('تم التحويل بنجاح ✅');
    closeOverdraft();
    ['trf-from-search','trf-to-search'].forEach(id => document.getElementById(id).value='');
    ['trf-from-id','trf-to-id'].forEach(id => document.getElementById(id).value='');
    document.getElementById('trf-amount').value='';
    document.getElementById('trf-preview').style.display='none';
    await UI.updateTreasury();
    await renderRecent();
  } else if (result.needsConfirm) {
    const sym = cur==='usd'?'$':'€';
    document.getElementById('overdraft-msg').innerHTML =
      `رصيد المرسل: <b>${sym}${result.currentBal.toFixed(2)}</b><br>
       المطلوب: <b>${sym}${amt.toFixed(2)}</b><br>
       سيصبح: <b style="color:var(--red);">${sym}${(result.currentBal-amt).toFixed(2)}</b>`;
    document.getElementById('overdraft-modal').style.display='flex';
  } else { UI.toast(result.error,'error'); }
}
function closeOverdraft() { document.getElementById('overdraft-modal').style.display='none'; }

async function renderRecent() {
  const txns = (await Transactions.getAll({type:'trf'})).slice(0,10);
  document.getElementById('recent-trf-tbody').innerHTML = txns.length
    ? (await Promise.all(txns.map(async t => {
        const [fromAcc, toAcc] = await Promise.all([Accounts.getById(t.from), Accounts.getById(t.to)]);
        const sym = t.cur==='usd'?'$':'€';
        return `<tr>
          <td style="font-size:0.72rem;color:var(--text3);">${UI.formatDate(t.date)}</td>
          <td>${UI.escapeHtml(fromAcc?fromAcc.name:t.from)}</td>
          <td>${UI.escapeHtml(toAcc?toAcc.name:t.to)}</td>
          <td style="color:var(--blue);font-weight:600;">${sym}${parseFloat(t.amt).toFixed(2)}</td>
        </tr>`;
      }))).join('')
    : '<tr><td colspan="4" class="empty-state">لا توجد تحويلات</td></tr>';
}
</script>
</body>
</html>
