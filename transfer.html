<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-Group — تحويل أرصدة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div id="treasury-placeholder"></div>
    <div class="page-header">
      <div>
        <h2 data-i18n="transfer_title">🔄 تحويل أرصدة</h2>
        <p data-i18n="transfer_subtitle">نقل رصيد بين حسابين</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h3 data-i18n="transfer_data">بيانات التحويل</h3>

      <!-- المرسل -->
      <div class="form-group">
        <label>
          <span data-i18n="from_account">من حساب (المرسل)</span>
          <span style="color:var(--text3);font-size:0.7rem;" data-i18n="search_hint">(Enter لاختيار أول نتيجة)</span>
        </label>
        <div class="search-wrap">
          <input type="text" id="trf-from-search" data-i18n-placeholder="search_placeholder" placeholder="ابحث…" autocomplete="off">
          <div id="trf-from-res" class="search-dropdown"></div>
        </div>
        <input type="hidden" id="trf-from-id">
      </div>
      <!-- بطاقة رصيد المرسل -->
      <div id="from-bal-box" style="display:none; margin-bottom:12px; padding:10px 14px;
           background:var(--surface2); border:1px solid var(--border2); border-radius:8px;
           font-size:0.83rem;">
        <span style="color:var(--text3);" data-i18n="sender_balance">رصيد المرسل:</span>
        <b id="from-bal-usd" style="margin-right:10px;color:var(--gold);"></b>
        <b id="from-bal-eur" style="margin-right:10px;color:var(--euro);"></b>
      </div>

      <!-- المستقبل -->
      <div class="form-group">
        <label data-i18n="to_account">إلى حساب (المستقبل)</label>
        <div class="search-wrap">
          <input type="text" id="trf-to-search" data-i18n-placeholder="search_placeholder" placeholder="ابحث…" autocomplete="off">
          <div id="trf-to-res" class="search-dropdown"></div>
        </div>
        <input type="hidden" id="trf-to-id">
      </div>
      <!-- بطاقة رصيد المستقبل -->
      <div id="to-bal-box" style="display:none; margin-bottom:12px; padding:10px 14px;
           background:var(--surface2); border:1px solid var(--border2); border-radius:8px;
           font-size:0.83rem;">
        <span style="color:var(--text3);" data-i18n="receiver_balance">رصيد المستقبل:</span>
        <b id="to-bal-usd" style="margin-right:10px;color:var(--gold);"></b>
        <b id="to-bal-eur" style="margin-right:10px;color:var(--euro);"></b>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label data-i18n="currency">العملة</label>
          <select id="trf-cur" class="currency-select" onchange="updatePreview()"></select>
        </div>
        <div class="form-group">
          <label data-i18n="exchange_rate">سعر الصرف (للمستقبل)</label>
          <input type="number" id="trf-rate" value="1" step="0.0001" min="0" oninput="updatePreview()">
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="amount">المبلغ</label>
        <input type="number" id="trf-amount" placeholder="0.00" min="0" step="0.01"
               oninput="updatePreview()"
               onkeydown="if(event.key==='Enter') doTransfer(false)">
      </div>

      <!-- معاينة -->
      <div id="trf-preview" style="display:none; border-radius:8px; padding:14px;
           margin-bottom:16px; background:var(--surface2); border:1px solid var(--border2); font-size:0.83rem;">
        <div id="trf-prev-from" style="margin-bottom:8px;"></div>
        <div id="trf-prev-to"></div>
      </div>

      <button class="btn btn-primary btn-full" onclick="doTransfer(false)" data-i18n="execute_transfer">🔄 تنفيذ التحويل</button>
      <button class="btn btn-ghost btn-full" id="trf-receipt-btn" onclick="printLastReceipt()"
              style="display:none;margin-top:8px;" data-i18n="print_receipt_btn">🖨️ طباعة إيصال العملية</button>
    </div>

    <!-- آخر التحويلات -->
    <div class="card">
      <h3 data-i18n="recent_transfers">آخر التحويلات</h3>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th data-i18n="col_time">الوقت</th>
            <th data-i18n="col_from">من</th>
            <th data-i18n="col_to">إلى</th>
            <th data-i18n="col_amount">المبلغ</th>
          </tr></thead>
          <tbody id="recent-trf-tbody">
            <tr><td colspan="4" class="empty-state" data-i18n="loading">جاري التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Overdraft Modal -->
<div id="overdraft-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
     z-index:1000;align-items:center;justify-content:center;padding:16px;">
  <div class="card" style="width:100%;max-width:420px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
    <h3 data-i18n="overdraft_sender">رصيد المرسل غير كافٍ</h3>
    <p id="overdraft-msg" style="color:var(--text2);margin:14px 0;font-size:0.87rem;line-height:1.7;"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeOverdraft()" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-danger" onclick="doTransfer(true)" data-i18n="proceed_negative">المتابعة بالسالب</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/currency.js"></script>
<script src="js/print-brand.js"></script><script src="js/receipt.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
(async () => {
  if (!await initApp('transfer')) return;
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();
  await Currency.refreshSelects('USD');
  UI.initSearch('trf-from', async (id) => {
    await showBalBox('from', id);
    updatePreview();
  });
  UI.initSearch('trf-to', async (id) => {
    await showBalBox('to', id);
    updatePreview();
  });
  await renderRecent();
  I18n.apply();
})();

async function showBalBox(side, id) {
  const box   = document.getElementById(side + '-bal-box');
  const usdEl = document.getElementById(side + '-bal-usd');
  const eurEl = document.getElementById(side + '-bal-eur');
  if (!id) { box.style.display='none'; return; }
  const [usd, eur] = await Promise.all([
    Storage.getBalance(id,'usd'),
    Storage.getBalance(id,'eur')
  ]);
  usdEl.textContent = Currency.formatMoney(usd, '$');
  eurEl.textContent = Currency.formatMoney(eur, '€');
  usdEl.style.color = usd < 0 ? 'var(--red)' : 'var(--gold)';
  eurEl.style.color = eur < 0 ? 'var(--red)' : 'var(--euro)';
  box.style.display = 'block';
}

async function updatePreview() {
  const fromId = document.getElementById('trf-from-id').value;
  const toId   = document.getElementById('trf-to-id').value;
  const cur    = document.getElementById('trf-cur').value;
  const amt    = parseFloat(document.getElementById('trf-amount').value) || 0;
  const rate   = parseFloat(document.getElementById('trf-rate').value) || 1;
  const box    = document.getElementById('trf-preview');
  if (!fromId || !toId || amt <= 0) { box.style.display='none'; return; }
  const activeCurs = await Currency.getActive();
  const curObj     = activeCurs.find(c => c.code.toLowerCase() === cur.toLowerCase());
  const sym        = curObj ? curObj.symbol : cur.toUpperCase();
  const fromBal    = await Storage.getBalance(fromId, cur);
  const newFrom    = fromBal - amt;
  const gross      = parseFloat((amt * rate).toFixed(2));
  const accounts   = await Storage.getAccounts();
  const toAcc      = accounts.find(a => a.id === toId);
  const ratePct    = (toAcc && toAcc.type==='customer') ? parseFloat(toAcc.commission_rate??0.025) : 0;
  const rawComm    = ratePct > 0 ? parseFloat((gross * ratePct / 100).toFixed(2)) : 0;
  const commission = rawComm >= 0.01 ? rawComm : 0;
  const net        = parseFloat((gross - commission).toFixed(2));

  document.getElementById('trf-prev-from').innerHTML =
    `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
      <div><div style="font-size:0.67rem;color:var(--text3);">${I18n.t('outgoing')}</div>
           <b style="color:var(--red);">-${Currency.formatMoney(amt,sym)}</b></div>
      <div><div style="font-size:0.67rem;color:var(--text3);">${I18n.t('sender_after')}</div>
           <b style="color:${newFrom<0?'var(--red)':'var(--text)'};">${Currency.formatMoney(newFrom,sym)}</b>
           ${newFrom<0?'<span style="color:var(--red);font-size:0.72rem;"> ⚠️</span>':''}</div>
    </div>`;
  document.getElementById('trf-prev-to').innerHTML =
    `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;
          padding-top:10px;border-top:1px solid var(--border);">
      <div><div style="font-size:0.67rem;color:var(--text3);">${I18n.t('gross_to_receiver')}</div>
           <b>${Currency.formatMoney(gross,sym)}</b>
           ${rate!==1?`<span style="font-size:0.72rem;color:var(--text3);"> (×${rate})</span>`:''}
      </div>
      ${commission>0?`<div><div style="font-size:0.67rem;color:var(--text3);">${I18n.t('commission_pct')} (${ratePct}%)</div>
           <b style="color:var(--red);">-${Currency.formatMoney(commission,sym)}</b></div>`:''}
      <div><div style="font-size:0.67rem;color:var(--text3);">${I18n.t('net_to_receiver')}</div>
           <b style="color:var(--green);">+${Currency.formatMoney(net,sym)}</b></div>
    </div>`;
  box.style.display = 'block';
}

let _lastTxn = null;

async function doTransfer(force) {
  const from = document.getElementById('trf-from-id').value;
  const to   = document.getElementById('trf-to-id').value;
  const cur  = document.getElementById('trf-cur').value;
  const amt  = parseFloat(document.getElementById('trf-amount').value);
  const rate = parseFloat(document.getElementById('trf-rate').value) || 1;
  UI.showLoading(true);
  const result = await Transactions.transfer(from, to, cur, amt, rate, force);
  UI.showLoading(false);
  if (result.ok) {
    UI.toast(I18n.t('transfer_success'));
    closeOverdraft();
    _lastTxn = {
      id: result.id, type: 'trf', acc: from, from, to, cur, amt, rate,
      commission_amt: result.commission || 0,
      by: Auth.getUser()?.user || '', date: new Date().toISOString(), note: ''
    };
    document.getElementById('trf-receipt-btn').style.display = 'block';
    UI.clearSearch('trf-from');
    UI.clearSearch('trf-to');
    document.getElementById('trf-amount').value='';
    document.getElementById('trf-preview').style.display='none';
    ['from-bal-box','to-bal-box'].forEach(id => document.getElementById(id).style.display='none');
    await UI.updateTreasury();
    await renderRecent();
  } else if (result.needsConfirm) {
    const sym = await Currency.symbol(cur.toUpperCase());
    document.getElementById('overdraft-msg').innerHTML =
      `${I18n.t('sender_balance_lbl')}: <b>${Currency.formatMoney(result.currentBal,sym)}</b><br>
       ${I18n.t('required_amount')}: <b>${Currency.formatMoney(amt,sym)}</b><br>
       ${I18n.t('will_become')}: <b style="color:var(--red);">${Currency.formatMoney((result.currentBal-amt),sym)}</b>`;
    document.getElementById('overdraft-modal').style.display='flex';
  } else { UI.toast(result.error,'error'); }
}

async function printLastReceipt() {
  if (!_lastTxn) return;
  const accounts = await Accounts.getAll();
  Receipt.print(_lastTxn, accounts);
}

function closeOverdraft() { document.getElementById('overdraft-modal').style.display='none'; }

async function renderRecent() {
  const [allTxns, accounts] = await Promise.all([
    Transactions.getAll({type:'trf'}),
    Accounts.getAll()
  ]);
  const txns = UI.filterActiveTxns(allTxns, accounts).slice(0,10);
  document.getElementById('recent-trf-tbody').innerHTML = txns.length
    ? (await Promise.all(txns.map(async t => {
        const [fromAcc, toAcc] = await Promise.all([
          Accounts.getById(t.from), Accounts.getById(t.to)
        ]);
        const curs   = await Currency.getActive();
        const curObj = curs.find(c => c.code.toLowerCase() === (t.cur||'').toLowerCase());
        const sym    = curObj ? curObj.symbol : (t.cur||'').toUpperCase();
        return `<tr>
          <td style="font-size:0.72rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
          <td>${UI.escapeHtml(fromAcc?fromAcc.name:t.from)}</td>
          <td>${UI.escapeHtml(toAcc?toAcc.name:t.to)}</td>
          <td style="color:var(--blue);font-weight:600;">${Currency.formatMoney(parseFloat(t.amt),sym)}</td>
        </tr>`;
      }))).join('')
    : `<tr><td colspan="4" class="empty-state">${I18n.t('no_transfers')}</td></tr>`;
}
</script>
</body>
</html>
