<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="history_title">📝 سجل التعديلات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.quick-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.qf-btn {
  padding:6px 14px; border-radius:20px; border:1px solid var(--border2);
  background:transparent; color:var(--text2); font-size:0.76rem;
  font-family:inherit; cursor:pointer; transition:all .15s; white-space:nowrap;
}
.qf-btn:hover,.qf-btn.active { background:var(--gold-dim); color:var(--gold); border-color:var(--gold); }
.change-badge {
  display:inline-block; padding:2px 8px; border-radius:20px;
  font-size:0.68rem; font-weight:600;
}
.old-val {
  background:var(--red-dim); color:var(--red);
  padding:2px 7px; border-radius:5px; font-size:0.75rem;
  text-decoration:line-through;
}
.new-val {
  background:var(--green-dim); color:var(--green);
  padding:2px 7px; border-radius:5px; font-size:0.75rem;
  font-weight:600;
}
.print-header { display:none; }
@media print {
  #sidebar,#topbar,#sidebar-overlay,#toast,#treasury-bar,
  #treasury-placeholder,.no-print,.quick-filters,
  .filter-card { display:none !important; }
  .print-header { display:block !important; margin-bottom:16px;
    border-bottom:3px solid #c9a84c; padding-bottom:12px; }
  body { background:#fff !important; color:#111 !important; }
  #main { margin:0 !important; padding:16px !important; }
  .card { background:#fff !important; border:1px solid #ccc !important; }
  table { width:100% !important; font-size:0.79rem; }
  th { background:#f5f0e0 !important; color:#333 !important; border-bottom:2px solid #c9a84c !important; }
  td { border-bottom:1px solid #eee !important; color:#111 !important; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
}
</style>
</head>
<body>
<div id="app">
<main id="main">
<div id="treasury-placeholder"></div>

<!-- ترويسة الطباعة -->
<div class="print-header">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1 id="print-report-brand" style="font-size:1.3rem;color:#111;font-weight:700;"></h1>
      <p id="print-period" style="font-size:0.75rem;color:#555;margin-top:3px;"></p>
    </div>
    <div style="font-size:0.75rem;color:#555;">
      <span id="print-on-lbl"></span> <b id="print-date"></b>
    </div>
  </div>
  <div style="margin-top:6px;font-size:0.65rem;color:#aaa;text-align:center;" id="print-dawtech-history"></div>
</div>

<div class="page-header">
  <div>
    <h2 data-i18n="history_title">📝 سجل التعديلات</h2>
    <p data-i18n="history_subtitle">تتبع جميع التغييرات على البيانات</p>
  </div>
  <div style="display:flex;gap:8px;" class="no-print">
    <button class="btn btn-ghost btn-sm" onclick="window.print()" data-i18n="print_btn">🖨️ طباعة</button>
    <button class="btn btn-primary btn-sm" onclick="exportHistoryExcel()">📊 Excel</button>
  </div>
</div>

<!-- فلاتر -->
<div class="card filter-card" style="padding:14px 16px;margin-bottom:14px;">
  <div class="quick-filters">
    <button class="qf-btn active" onclick="setQuick('today')" data-i18n="qf_today">اليوم</button>
    <button class="qf-btn" onclick="setQuick('month')" data-i18n="qf_month">هذا الشهر</button>
    <button class="qf-btn" onclick="setQuick('all')" data-i18n="qf_all">الكل</button>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px;">
    <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;">
      <label data-i18n="edit_type">نوع التعديل</label>
      <select id="f-type" onchange="applyFilter()">
        <option value="all" data-i18n="qf_all">الكل</option>
        <option value="edit_name" data-i18n="edit_type_name">تعديل الاسم</option>
        <option value="edit_commission" data-i18n="edit_type_commission">تعديل العمولة</option>
        <option value="edit_note" data-i18n="edit_type_note">تعديل ملاحظة</option>
        <option value="edit_account" data-i18n="edit_type_account">تعديل حساب</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;">
      <label data-i18n="filter_user">المستخدم</label>
      <input type="text" id="f-user" data-i18n-placeholder="username_placeholder" placeholder="اسم المستخدم…" oninput="applyFilter()">
    </div>
    <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;">
      <label data-i18n="from_date">من تاريخ</label>
      <input type="date" id="f-from" onchange="clearQuick();loadHistory()">
    </div>
    <div class="form-group" style="flex:1;min-width:130px;margin-bottom:0;">
      <label data-i18n="to_date">إلى تاريخ</label>
      <input type="date" id="f-to" onchange="clearQuick();loadHistory()">
    </div>
  </div>
</div>

<!-- جدول -->
<div class="card" style="padding:0;overflow:hidden;">
  <div class="tbl-wrap" style="border:none;border-radius:0;margin:0;">
    <table id="history-table">
      <thead><tr>
        <th data-i18n="col_date">التاريخ</th>
        <th data-i18n="edit_type">نوع التعديل</th>
        <th data-i18n="col_account_lbl">الحساب</th>
        <th data-i18n="col_old_val">القيمة القديمة</th>
        <th data-i18n="col_new_val">القيمة الجديدة</th>
        <th data-i18n="col_by_lbl">بواسطة</th>
      </tr></thead>
      <tbody id="history-tbody">
        <tr><td colspan="6" class="empty-state" data-i18n="loading">جاري التحميل…</td></tr>
      </tbody>
    </table>
  </div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;">
  <div id="history-count" style="font-size:0.74rem;color:var(--text3);"></div>
  <div class="pagination no-print" id="history-pages"></div>
</div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
const PAGE_SIZE = 20;
let _allLogs  = [];
let _filtered = [];
let _page     = 1;
let _printMode = false;

(async () => {
  if (!await initApp('history')) return;
  if (!Auth.can('viewHistory') && !Auth.isAdmin()) { navTo('dashboard.html'); return; }
  document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
  await UI.updateTreasury();

  document.getElementById('print-date').textContent = new Date().toLocaleDateString('ar-SA');
  document.getElementById('print-report-brand').textContent =
    brandName() + ' — ' + I18n.t('history_title');
  document.getElementById('print-on-lbl').textContent = I18n.t('printed_on_lbl');
  document.getElementById('print-dawtech-history').textContent = brandPrintCopyright();

  window.addEventListener('beforeprint', () => {
    const from = document.getElementById('f-from').value;
    const to   = document.getElementById('f-to').value;
    const periodLabel = I18n.t('period_lbl');
    const allTimeLabel = I18n.t('qf_all');
    document.getElementById('print-period').textContent =
      (from || to) ? `${periodLabel} ${from} — ${to}` : allTimeLabel;
    _printMode = true; renderPage();
  });
  window.addEventListener('afterprint', () => {
    _printMode = false; renderPage();
  });

  const today = UI.todayStr();
  document.getElementById('f-from').value = today;
  document.getElementById('f-to').value   = today;
  await loadHistory();
  I18n.apply();
})();

function exportHistoryExcel() {
  UI.exportExcel('history-table', I18n.t('history_title') || 'History_Log');
}

async function loadHistory() {
  UI.showLoading(true);
  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  _allLogs   = await Storage.getAuditLogs({ from, to });
  _allLogs   = _allLogs.filter(l => l.action && l.action.startsWith('edit_'));
  UI.showLoading(false);
  applyFilter();
}

function setQuick(key) {
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
  const today = UI.todayStr();
  const map = {
    today: { from: today,              to: today },
    month: { from: UI.firstOfMonth(0), to: UI.lastOfMonth(0) },
    all:   { from: '',                 to: '' }
  };
  const r = map[key] || map.today;
  document.getElementById('f-from').value = r.from;
  document.getElementById('f-to').value   = r.to;
  const idx = { today:0, month:1, all:2 }[key];
  document.querySelectorAll('.qf-btn')[idx]?.classList.add('active');
  loadHistory();
}
function clearQuick() {
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
}

function applyFilter() {
  const fType = document.getElementById('f-type').value;
  const fUser = document.getElementById('f-user').value.toLowerCase().trim();

  _filtered = _allLogs.filter(l => {
    if (fType !== 'all' && l.action !== fType) return false;
    if (fUser && !(l.username||'').toLowerCase().includes(fUser)) return false;
    return true;
  });
  _page = 1;
  renderPage();
}

function _getTypeLabels() {
  return {
    edit_name:       '✏️ ' + (I18n.t('edit_type_name')       || 'تعديل الاسم'),
    edit_commission: '💰 ' + (I18n.t('edit_type_commission') || 'تعديل العمولة'),
    edit_note:       '📝 ' + (I18n.t('edit_type_note')       || 'تعديل ملاحظة'),
    edit_account:    '🔧 ' + (I18n.t('edit_type_account')    || 'تعديل حساب'),
  };
}

function renderPage() {
  const total      = _filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  const start      = (_page - 1) * PAGE_SIZE;
  const page       = _printMode ? _filtered : _filtered.slice(start, start + PAGE_SIZE);
  const typeLabels = _getTypeLabels();

  document.getElementById('history-tbody').innerHTML = page.length
    ? page.map(l => {
        const d      = l.details || {};
        const label  = typeLabels[l.action] || l.action;
        const accStr = d.accountId
          ? `<span style="font-size:0.75rem;color:var(--text3);">#${d.accountId}</span> ${UI.escapeHtml(d.accountName||'')}`
          : '—';
        const oldVal = d.oldValue !== undefined
          ? `<span class="old-val">${UI.escapeHtml(String(d.oldValue))}</span>`
          : '—';
        const newVal = d.newValue !== undefined
          ? `<span class="new-val">${UI.escapeHtml(String(d.newValue))}</span>`
          : '—';
        return `<tr>
          <td style="font-size:0.71rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(l.created_at)}</td>
          <td><span class="change-badge" style="background:var(--gold-dim);color:var(--gold);">${label}</span></td>
          <td style="font-size:0.78rem;">${accStr}</td>
          <td>${oldVal}</td>
          <td>${newVal}</td>
          <td style="font-size:0.75rem;color:var(--text2);font-weight:600;">${UI.escapeHtml(l.username||'—')}</td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="6" class="empty-state"><div class="empty-icon">📝</div>${I18n.t('no_edits') || 'لا توجد تعديلات مسجّلة'}</td></tr>`;

  const fromN = start + 1;
  const toN   = Math.min(start + PAGE_SIZE, total);
  document.getElementById('history-count').textContent = !total ? '' :
    _printMode
      ? `${total} ${I18n.t('edit_type') || 'تعديل'}`
      : `${fromN}–${toN} ${I18n.t('of_lbl') || 'من'} ${total} ${I18n.t('edit_type') || 'تعديل'}`;

  const pg = document.getElementById('history-pages');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page-1})" ${_page===1?'disabled':''}>‹</button>`;
  const sp = Math.max(1, _page-2), ep = Math.min(totalPages, _page+2);
  if (sp > 1) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(1)">1</button>`;
  if (sp > 2) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
  for (let i = sp; i <= ep; i++)
    html += `<button class="btn btn-sm ${i===_page?'btn-primary':'btn-ghost'}" onclick="goPage(${i})">${i}</button>`;
  if (ep < totalPages-1) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
  if (ep < totalPages)   html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page+1})" ${_page===totalPages?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  const t = Math.ceil(_filtered.length / PAGE_SIZE) || 1;
  if (p < 1 || p > t) return;
  _page = p;
  renderPage();
}
</script>
</body>
</html>
