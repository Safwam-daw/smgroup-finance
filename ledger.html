<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ledger_title">📒 السجل المحاسبي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
.day-nav { display:flex; align-items:center; gap:0; }
.day-nav input[type="date"] {
width:150px; text-align:center; border-radius:0;
border-top:1px solid var(--border2); border-bottom:1px solid var(--border2);
border-left:0; border-right:0; height:34px;
}
.day-nav .btn { border-radius:0; }
.day-nav .btn:first-child { border-radius:6px 0 0 6px; }
.day-nav .btn:last-child { border-radius:0 6px 6px 0; margin-inline-start:6px; }
</style>
</head>
<body>
<div id="app">
<main id="main">
<div id="treasury-placeholder"></div>
<div class="page-header">
<div><h2 data-i18n="ledger_title">📒 السجل المحاسبي</h2><p data-i18n="ledger_subtitle">جميع العمليات المالية</p></div>
<button class="btn btn-primary" onclick="UI.exportExcel('ledger-table','Daily_Ledger')" data-i18n="excel_btn">📊 Excel</button>
</div>
<!-- فلاتر -->
<div class="card" style="margin-bottom:14px; padding:14px 16px;">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
<div class="form-group" style="margin-bottom:0;"><label data-i18n="date">التاريخ</label>
<div class="day-nav">
<button type="button" class="btn btn-ghost btn-sm" onclick="shiftDay(-1)" title="السابق">‹</button>
<input type="date" id="f-date" onchange="applyFilter()">
<button type="button" class="btn btn-ghost btn-sm" onclick="shiftDay(1)" title="التالي">›</button>
<button type="button" class="btn btn-sm btn-primary" onclick="goToday()" data-i18n="qf_today">اليوم</button>
</div>
</div>
<div class="form-group" style="flex:1;min-width:120px;margin-bottom:0;"><label data-i18n="filter_type">نوع العملية</label>
<select id="f-type" onchange="applyFilter()">
<option value="all" data-i18n="filter_all">الكل</option>
<option value="dep" data-i18n="filter_deposit">إيداع</option>
<option value="wit" data-i18n="filter_withdraw">سحب</option>
<option value="trf" data-i18n="filter_transfer">تحويل</option>
</select>
</div>
<div class="form-group" style="flex:1;min-width:110px;margin-bottom:0;"><label data-i18n="filter_currency">العملة</label>
<select id="f-cur" onchange="applyFilter()">
<option value="all" data-i18n="filter_all">الكل</option>
<option value="usd" data-i18n="filter_usd">دولار</option>
<option value="eur" data-i18n="filter_eur">يورو</option>
</select>
</div>
<div class="form-group" style="flex:1;min-width:140px;margin-bottom:0;"><label data-i18n="search_account_lbl">بحث بالحساب</label>
<input type="text" id="f-acc" data-i18n-placeholder="search_code_name_ph" placeholder="كود أو اسم…" oninput="applyFilter()">
</div>
</div>
</div>
<!-- إحصاءات -->
<div id="ledger-totals" style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;
overflow-x:auto;-webkit-overflow-scrolling:touch;"></div>
<!-- جدول -->
<div class="card" style="padding:0;overflow:hidden;">
<div class="tbl-wrap" style="border:none;border-radius:0;margin:0;">
<table id="ledger-table">
<thead>
<tr>
<th data-i18n="col_time_lbl">الوقت</th><th data-i18n="col_type_lbl">النوع</th><th data-i18n="col_account_lbl">الحساب</th>
<th data-i18n="col_currency">العملة</th><th data-i18n="col_amount_lbl">المبلغ</th><th data-i18n="col_rate">سعر الصرف</th><th data-i18n="col_by_lbl">بواسطة</th>
</tr>
</thead>
<tbody id="ledger-tbody">
<tr><td colspan="7" class="empty-state" data-i18n="loading">جاري التحميل…</td></tr>
</tbody>
</table>
</div>
</div>
<!-- التوازن اليومي -->
<div id="ledger-balance" class="card" style="margin-top:14px;padding:14px 16px;"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
<div id="ledger-count" style="font-size:0.74rem;color:var(--text3);"></div>
<div class="pagination" id="ledger-pages"></div>
</div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app-constants.js"></script><script src="js/db-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
<script src="js/accounts.js"></script><script src="js/transactions.js"></script>
<script src="js/ui.js"></script><script src="js/realtime.js"></script>
<script src="js/currency.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
const PAGE_SIZE = 20;
let _allTxns = [];
let _allAccounts = [];
let _filtered = [];
let _page = 1;
function typeLabel(type) {
  const map = {dep:t('type_dep'), wit:t('type_wit'), trf:t('type_trf')};
  return map[type] || type;
}

(async () => {
if (!await initApp('ledger')) return;
document.getElementById('treasury-placeholder').outerHTML = buildTreasuryBar();
await UI.updateTreasury();
_allAccounts = await Accounts.getAll();
UI.showLoading(true);
const allTxns = await Transactions.getAll();
// فلترة عمليات الأرشيف (7xxx)، وحركات العمولة (إشعارات مستقلة لا تظهر في السجل اليومي)
_allTxns = allTxns.filter(t =>
  !String(t.acc||'').startsWith('7') &&
  !String(t.from||'').startsWith('7') &&
  !String(t.to||'').startsWith('7') &&
  !t.is_commission_entry
);
UI.showLoading(false);
document.getElementById('f-date').value = UI.todayStr();
applyFilter();
})();

function shiftDay(delta) {
const el = document.getElementById('f-date');
const d = el.value ? new Date(el.value + 'T00:00:00') : new Date();
d.setDate(d.getDate() + delta);
const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
el.value = `${y}-${m}-${day}`;
applyFilter();
}
function goToday() {
document.getElementById('f-date').value = UI.todayStr();
applyFilter();
}

function _dayBounds(dateStr) {
if (!dateStr) return null;
const [y,m,d] = dateStr.split('-').map(Number);
const from = new Date(y, m-1, d, 0,0,0,0);
const to   = new Date(y, m-1, d, 23,59,59,999);
return { from, to };
}

function applyFilter() {
const fType = document.getElementById('f-type').value;
const fCur = document.getElementById('f-cur').value;
const fAcc = document.getElementById('f-acc').value.toLowerCase().trim();
const fDate = document.getElementById('f-date').value;
const bounds = _dayBounds(fDate);
_filtered = _allTxns.filter(t => {
if (fType !== 'all' && t.type !== fType) return false;
if (fCur !== 'all' && (t.cur||'').toLowerCase() !== fCur) return false;
if (bounds) {
const td = new Date(t.date);
if (td < bounds.from || td > bounds.to) return false;
}
if (fAcc) {
const ids = [t.acc, t.from, t.to].filter(Boolean);
const names = ids.map(id => { const a=_allAccounts.find(x=>x.id===id); return a?a.name.toLowerCase():''; });
if (!ids.some(i=>i.toLowerCase().includes(fAcc)) && !names.some(n=>n.includes(fAcc))) return false;
}
return true;
});
_page = 1;
renderTotals();
renderBalance();
renderPage();
}

// يحسب حركات اليوم المختار بالكامل بغض النظر عن فلاتر النوع/العملة/الحساب
function _dayTxns(dateStr) {
const bounds = _dayBounds(dateStr);
if (!bounds) return [];
return _allTxns.filter(tx => {
const d = new Date(tx.date);
return d >= bounds.from && d <= bounds.to;
});
}

async function renderBalance() {
const dateStr = document.getElementById('f-date').value;
const box = document.getElementById('ledger-balance');
if (!dateStr) { box.innerHTML = ''; return; }

const dayTxns = _dayTxns(dateStr);
let dep = {usd:0, eur:0}, wit = {usd:0, eur:0};
dayTxns.forEach(tx => {
if (tx.type==='dep') dep[(tx.cur||'').toLowerCase()] += parseFloat(tx.amt);
if (tx.type==='wit') wit[(tx.cur||'').toLowerCase()] += parseFloat(tx.amt);
});

const snap = await Storage.getSnapshotOnOrBefore(dateStr);
const hasOpen = !!snap;
const openUsd = hasOpen ? parseFloat(snap.treasury_usd||0) : 0;
const openEur = hasOpen ? parseFloat(snap.treasury_eur||0) : 0;
const closeUsd = openUsd + dep.usd - wit.usd;
const closeEur = openEur + dep.eur - wit.eur;

const row = (label, usdVal, eurVal, color) => `
<div style="text-align:center;padding:8px 0;border-bottom:1px solid var(--border2);">
<div style="font-size:0.72rem;color:var(--text3);">${label}</div>
<div style="font-weight:700;color:${color||'var(--text)'};font-size:0.95rem;margin-top:3px;">
$${usdVal.toFixed(2)} &nbsp;|&nbsp; €${eurVal.toFixed(2)}
</div>
</div>`;

box.innerHTML = `
<div style="font-size:0.85rem;font-weight:700;margin-bottom:12px;color:var(--gold);text-align:center;">
⚖️ ${t('daily_balance_title')}
</div>
${row(t('opening_balance'), openUsd, openEur)}
${row(t('stat_deposits'), dep.usd, dep.eur, 'var(--green)')}
${row(t('stat_withdrawals'), wit.usd, wit.eur, 'var(--red)')}
<div style="text-align:center;padding:14px 0 4px;">
<div style="font-size:0.78rem;color:var(--text3);">${t('closing_balance')}</div>
<div style="font-weight:700;color:var(--gold);font-size:1.25rem;margin-top:4px;">
$${closeUsd.toFixed(2)} &nbsp;|&nbsp; €${closeEur.toFixed(2)}
</div>
</div>
${!hasOpen ? `<div style="font-size:0.7rem;color:var(--text3);margin-top:8px;">
⚠️ ${t('no_prior_snapshot')}
</div>` : ''}
`;
}

function renderTotals() {
let dep={usd:0,eur:0}, wit={usd:0,eur:0};
_filtered.forEach(t => {
if (t.type==='dep') dep[(t.cur||'').toLowerCase()]+=parseFloat(t.amt);
if (t.type==='wit') wit[(t.cur||'').toLowerCase()]+=parseFloat(t.amt);
});
document.getElementById('ledger-totals').innerHTML = `
<div class="stat-card" style="flex:2;min-width:230px;padding:12px 16px;border-right:3px solid var(--gold);">
<div style="display:flex;gap:20px;flex-wrap:wrap;">
<div>
<div class="stat-label" style="color:var(--green);">${t('stat_deposits')}</div>
<div style="font-size:0.85rem;font-weight:700;color:var(--green);margin-top:4px;">
$${dep.usd.toFixed(2)} | €${dep.eur.toFixed(2)}</div>
</div>
<div>
<div class="stat-label" style="color:var(--red);">${t('stat_withdrawals')}</div>
<div style="font-size:0.85rem;font-weight:700;color:var(--red);margin-top:4px;">
$${wit.usd.toFixed(2)} | €${wit.eur.toFixed(2)}</div>
</div>
</div>
</div>
<div class="stat-card" style="flex:1;min-width:100px;padding:12px 16px;border-right:3px solid var(--blue);">
<div class="stat-label">${t('stat_op_count')}</div>
<div style="font-size:1.1rem;font-weight:700;color:var(--blue);margin-top:4px;">${_filtered.length}</div>
</div>`;
}

function renderPage() {
const total = _filtered.length;
const totalPages = Math.ceil(total/PAGE_SIZE) || 1;
const start = (_page-1)*PAGE_SIZE;
const page = _filtered.slice(start, start+PAGE_SIZE);
const tbody = document.getElementById('ledger-tbody');
tbody.innerHTML = page.length
? page.map(t => {
const sym = (t.cur||'').toLowerCase()==='usd'?'$':'€';
const color = {dep:'var(--green)',wit:'var(--red)',trf:'var(--blue)'}[t.type]||'var(--text)';
let accStr;
if (t.type==='trf') {
const fa=_allAccounts.find(x=>x.id===t.from);
const ta=_allAccounts.find(x=>x.id===t.to);
accStr=`<span style="color:var(--text2);">${UI.escapeHtml(fa?.name||t.from)}</span>
<span style="color:var(--text3);"> ← </span>
<span style="color:var(--text2);">${UI.escapeHtml(ta?.name||t.to)}</span>`;
} else {
const a=_allAccounts.find(x=>x.id===t.acc);
accStr=`<button class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:0.72rem;"
onclick="navTo('statement.html?acc=${UI.escapeHtml(t.acc||'')}')"
>${UI.escapeHtml(a?.name||t.acc||'—')}</button>`;
}
return `<tr>
<td style="font-size:0.71rem;color:var(--text3);white-space:nowrap;">${UI.formatDate(t.date)}</td>
<td><span class="badge badge-${t.type}">${typeLabel(t.type)}</span></td>
<td>${accStr}</td>
<td>${t.cur.toUpperCase()}</td>
<td style="font-weight:700;color:${color};">${sym}${parseFloat(t.amt).toFixed(2)}</td>
<td style="color:var(--text3);font-size:0.75rem;">${t.rate&&parseFloat(t.rate)!==1?'×'+t.rate:'—'}</td>
<td style="font-size:0.73rem;color:var(--text2);">${UI.escapeHtml(t.by)}</td>
</tr>`;
}).join('')
: `<tr><td colspan="7" class="empty-state"><div class="empty-icon">📒</div>${t('no_match')}</td></tr>`;
document.getElementById('ledger-count').textContent =
t('showing_range', {from:start+1, to:Math.min(start+PAGE_SIZE,total), total, unit:t('operation_unit')});
const pg = document.getElementById('ledger-pages');
if (totalPages <= 1) { pg.innerHTML=''; return; }
let html = `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page-1})" ${_page===1?'disabled':''}>‹</button>`;
const start_p = Math.max(1, _page-2);
const end_p = Math.min(totalPages, _page+2);
if (start_p > 1) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(1)">1</button>`;
if (start_p > 2) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
for (let i=start_p; i<=end_p; i++)
html += `<button class="btn btn-sm ${i===_page?'btn-primary':'btn-ghost'}" onclick="goPage(${i})">${i}</button>`;
if (end_p < totalPages-1) html += `<span style="color:var(--text3);padding:0 4px;">…</span>`;
if (end_p < totalPages) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${totalPages})">${totalPages}</button>`;
html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${_page+1})" ${_page===totalPages?'disabled':''}>›</button>`;
pg.innerHTML = html;
}
function goPage(p) {
const totalPages = Math.ceil(_filtered.length/PAGE_SIZE)||1;
if (p<1||p>totalPages) return;
_page = p;
renderPage();
document.querySelector('.card[style*="padding:0"]')?.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
